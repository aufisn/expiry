/* =====================================================================================
   ATTACHMENTS (M3) — scans, photos and PDFs.
   • Bytes live in IndexedDB (expiry_files), never in plain form:
       – normal images: AES-GCM under the data key (readable while the app is unlocked)
       – sensitive images: sealed to the vault public key (readable only after a reveal)
   • Metadata lives in the encrypted state: doc.attachments = [{id, kind, mime, name, label,
     size, sensitive, hasThumb, createdAt}].
   • Thumbnails exist only for non-sensitive images (no blurred copy of an ID is ever stored).
   • Images are resized to max 2000px and re-encoded as JPEG to stay around 200–400 KB.
   ===================================================================================== */
const FILE_DB = 'expiry_files';
const MAX_EDGE = 2000, THUMB_EDGE = 360, TARGET_BYTES = 400*1024, MAX_PDF_BYTES = 15*1024*1024;
let _dbP = null;
function idb(){
  if(!_dbP) _dbP = new Promise((res, rej)=>{
    if(!window.indexedDB){ rej(new Error('IndexedDB unavailable')); return; }
    const r = indexedDB.open(FILE_DB, 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore('files', { keyPath:'id' }); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
  return _dbP;
}
function idbReq(mode, fn){
  return idb().then(db=>new Promise((res, rej)=>{
    const tx = db.transaction('files', mode); const st = tx.objectStore('files');
    let out; const r = fn(st); if(r) r.onsuccess = ()=>{ out = r.result; };
    tx.oncomplete = ()=>res(out); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error);
  }));
}
const idbPut = (rec)=>idbReq('readwrite', st=>st.put(rec));
const idbGet = (id)=>idbReq('readonly', st=>st.get(id));
function idbDelete(ids){ return idbReq('readwrite', st=>{ ids.forEach(id=>st.delete(id)); return null; }); }
function deleteFileDb(){
  return new Promise(res=>{
    const finish = ()=>{ _dbP = null; res(); };
    const go = ()=>{ try{ const r = indexedDB.deleteDatabase(FILE_DB); r.onsuccess = r.onerror = r.onblocked = finish; }catch(e){ finish(); } };
    if(_dbP) _dbP.then(db=>{ try{ db.close(); }catch(e){} go(); }, go); else if(window.indexedDB) go(); else finish();
  });
}

/* ----- binary encryption ----- */
async function encBytes(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv, ct: await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, bytes) };
}
async function sealBytes(bytes){
  if(!_skPubKey) _skPubKey = await crypto.subtle.importKey('spki', unb64(lockRec.skPub), { name:'RSA-OAEP', hash:'SHA-256' }, false, ['encrypt']);
  const k = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt']);
  const ek = await crypto.subtle.encrypt({ name:'RSA-OAEP' }, _skPubKey, await crypto.subtle.exportKey('raw', k));
  const e = await encBytes(k, bytes);
  return { ek, iv:e.iv, ct:e.ct };
}
async function openSealedBytes(priv, rec){
  const raw = await crypto.subtle.decrypt({ name:'RSA-OAEP' }, priv, rec.ek);
  const k = await crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:rec.iv }, k, rec.ct));
}
async function writeFile(id, bytes, sensitive){
  if(sensitive){ const s = await sealBytes(bytes); await idbPut({ id, mode:'vault', ek:s.ek, iv:s.iv, ct:s.ct }); }
  else { const e = await encBytes(_sessionKey, bytes); await idbPut({ id, mode:'dek', iv:e.iv, ct:e.ct }); }
}
async function readFile(id){
  const rec = await idbGet(id);
  if(!rec) throw new Error('missing file');
  if(rec.mode==='vault'){
    if(!_skPriv) throw new Error('locked');
    return openSealedBytes(_skPriv, rec);
  }
  if(!_sessionKey) throw new Error('locked');
  return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:rec.iv }, _sessionKey, rec.ct));
}

/* ----- preparing files: compress images, keep PDFs ----- */
function canvasToBlob(canvas, type, q){ return new Promise(res=>canvas.toBlob(res, type, q)); }
async function drawScaled(source, w, h, edge){
  const scale = Math.min(1, edge/Math.max(w, h));
  const cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(source, 0, 0, cw, ch);
  return c;
}
async function compressImage(file){
  const original = new Uint8Array(await file.arrayBuffer());
  if(typeof createImageBitmap!=='function') return { bytes:original, mime:file.type||'image/jpeg', thumb:null }; // test env
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ throw new Error('That image couldn’t be read.'); }
  const big = await drawScaled(bmp, bmp.width, bmp.height, MAX_EDGE);
  let blob = null;
  for(const q of [0.85, 0.75, 0.65, 0.55]){ blob = await canvasToBlob(big, 'image/jpeg', q); if(blob && blob.size <= TARGET_BYTES) break; }
  const tc = await drawScaled(bmp, bmp.width, bmp.height, THUMB_EDGE);
  const tb = await canvasToBlob(tc, 'image/jpeg', 0.7);
  if(bmp.close) bmp.close();
  if(!blob) return { bytes:original, mime:file.type||'image/jpeg', thumb:null };
  return { bytes:new Uint8Array(await blob.arrayBuffer()), mime:'image/jpeg', thumb: tb ? new Uint8Array(await tb.arrayBuffer()) : null, w:big.width, h:big.height };
}
let _pdfjsP = null;
function loadPdfjs(){
  if(!_pdfjsP) _pdfjsP = import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs').then(m=>{
    m.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.worker.min.mjs';
    return m;
  }).catch(e=>{ _pdfjsP = null; throw e; });
  return _pdfjsP;
}
async function pdfDoc(bytes){ const pdfjs = await loadPdfjs(); return pdfjs.getDocument({ data: bytes.slice() }).promise; }
async function renderPdfPageToCanvas(pdf, n, width){
  const page = await pdf.getPage(n);
  const vp1 = page.getViewport({ scale:1 });
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const vp = page.getViewport({ scale: (width/vp1.width)*dpr });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  c.style.width = '100%';
  await page.render({ canvasContext:c.getContext('2d'), viewport:vp }).promise;
  return c;
}
async function pdfThumb(bytes){
  try{
    const pdf = await pdfDoc(bytes);
    const c = await renderPdfPageToCanvas(pdf, 1, THUMB_EDGE);
    const b = await canvasToBlob(c, 'image/jpeg', 0.7);
    return b ? new Uint8Array(await b.arrayBuffer()) : null;
  }catch(e){ return null; }
}
// Turns picked files into prepared pages (still in memory, not stored).
async function prepareFiles(fileList){
  const out = [], problems = [];
  for(const f of Array.from(fileList||[])){
    const isPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name||'');
    try{
      if(isPdf){
        if(f.size > MAX_PDF_BYTES){ problems.push(`${f.name} is larger than 15 MB.`); continue; }
        const bytes = new Uint8Array(await f.arrayBuffer());
        out.push({ kind:'pdf', mime:'application/pdf', name:f.name||'document.pdf', bytes, thumb: await pdfThumb(bytes) });
      } else if(/^image\//.test(f.type) || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name||'')){
        const r = await compressImage(f);
        out.push({ kind:'image', mime:r.mime, name:f.name||'photo.jpg', bytes:r.bytes, thumb:r.thumb, w:r.w||0, h:r.h||0 });
      } else problems.push(`${f.name||'That file'} isn’t an image or PDF.`);
    }catch(e){ problems.push(e.message || `${f.name} couldn’t be read.`); }
  }
  return { pages:out, problems };
}
function defaultLabel(index, page){
  if(page && page.kind==='pdf') return (page.name||'PDF').replace(/\.pdf$/i, '');
  return index===0 ? 'Front' : index===1 ? 'Back' : 'Page '+(index+1);
}
// Encrypts and stores prepared pages for a document; returns the attachment metadata.
async function storePages(pages, sensitive, startIndex){
  const metas = [];
  for(let i=0;i<pages.length;i++){
    const p = pages[i];
    const id = 'f'+uid();
    await writeFile(id, p.bytes, sensitive);
    let hasThumb = false;
    if(!sensitive && p.thumb){ await writeFile(id+':t', p.thumb, false); hasThumb = true; }
    metas.push({ id, kind:p.kind, mime:p.mime, name:p.name, label:p.label || defaultLabel(startIndex+i, p), size:p.bytes.length, sensitive:!!sensitive, hasThumb, createdAt:new Date().toISOString() });
  }
  requestPersistentStorage();
  return metas;
}
let _persistAsked = false;
function requestPersistentStorage(){
  if(_persistAsked) return; _persistAsked = true;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
function deleteAttachmentFiles(atts){
  const ids = []; (atts||[]).forEach(a=>{ ids.push(a.id); if(a.hasThumb) ids.push(a.id+':t'); dropUrl(a.id); });
  if(ids.length) return idbDelete(ids).catch(()=>{});
  return Promise.resolve();
}

/* ----- object URLs (decrypted bytes on screen) ----- */
const _urls = {}; // key -> {url, sensitive}
function dropUrl(id){ for(const k of Object.keys(_urls)) if(k===id || k.startsWith(id+'|')){ try{ URL.revokeObjectURL(_urls[k].url); }catch(e){} delete _urls[k]; } }
function dropUrls(onlySensitive){ for(const k of Object.keys(_urls)) if(!onlySensitive || _urls[k].sensitive){ try{ URL.revokeObjectURL(_urls[k].url); }catch(e){} delete _urls[k]; } }
async function urlFor(att, variant){ // variant: 'thumb' | 'full'
  const key = att.id+'|'+variant;
  if(_urls[key]) return _urls[key].url;
  const bytes = await readFile(variant==='thumb' ? att.id+':t' : att.id);
  const url = URL.createObjectURL(new Blob([bytes], { type: variant==='thumb' ? 'image/jpeg' : att.mime }));
  _urls[key] = { url, sensitive:att.sensitive };
  return url;
}
function bytesLabel(n){ return n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }

/* ----- tiles (detail + editor) ----- */
function tileHTML(att, i, docId, hid){

    <span class="tile-label">${esc(att.label)}${att.sensitive?' <i class="ti ti-lock-open" aria-hidden="true"></i>':''}</span></button>`;

function hydrateTiles(root){

  });
}

/* ----- picking files ----- */
let _pickTarget = null; // {mode:'new'} | {mode:'draft'} | {mode:'doc', id}
function pickFiles(source, target){
  _pickTarget = target;
  const input = $(source==='camera' ? 'pick-camera' : source==='photo' ? 'pick-photo' : 'pick-file');
  input.value = '';

function pickSourceSheet(target){
  openSheet({ render:()=>`<h3>Add images or files</h3>
    <button class="opt" data-act="pickSource" data-s="camera"><i class="ti ti-camera" aria-hidden="true"></i><div><div class="opt-t">Take photo</div><div class="opt-s">Use the camera</div></div></button>
    <button class="opt" data-act="pickSource" data-s="photo"><i class="ti ti-photo" aria-hidden="true"></i><div><div class="opt-t">Choose photo</div><div class="opt-s">From your gallery</div></div></button>

    target });

let _processing = false;
async function onFilesPicked(files){
  const target = _pickTarget; _pickTarget = null;
  if(!files || !files.length || !target || _locked) return;
  _processing = true; toast('Preparing '+(files.length===1?'file':files.length+' files')+'…');
  const { pages, problems } = await prepareFiles(files);
  _processing = false;
  if(_locked) return;
  const problem = problems.length ? ' '+problems[0]+(problems.length>1?' (and '+(problems.length-1)+' more)':'') : '';
  if(problems.length && !pages.length) toast(problem.trim());
  // the "Add images or files" chooser has done its job either way
  if(target.mode!=='new' && target.mode!=='renew' && topEntry() && topEntry().kind==='sheet' && topEntry().target) pop();
  if(!pages.length) return;
  pages.forEach(p=>{ p.url = URL.createObjectURL(new Blob([p.thumb || p.bytes], { type: p.thumb ? 'image/jpeg' : p.mime })); });
  if(target.mode==='new'){
    draft = newDraft('passport', defaultOwnerId());
    draft.pending = pages; draft.dirty = true; // photos count as unsaved work
    const top = topEntry();
    if(top && top.kind==='sheet') replaceTop({kind:'pane', screen:'edit'}); else push({kind:'pane', screen:'edit'});
    if(problem) toast(problem.trim());
    startReading(draft);
  } else if(target.mode==='renew'){
    const d = docById(target.id); if(!d){ pages.forEach(p=>URL.revokeObjectURL(p.url)); return; }
    draft = renewDraft(d);
    draft.pending = pages; draft.dirty = true;
    const top = topEntry();
    if(top && top.kind==='sheet') replaceTop({kind:'pane', screen:'edit'}); else push({kind:'pane', screen:'edit'});
    if(problem) toast(problem.trim());
    startReading(draft);
  } else if(target.mode==='draft' && draft){
    draft.pending = (draft.pending||[]).concat(pages); draft.dirty = true;
    rerenderEditor();
  } else if(target.mode==='doc'){
    const d = docById(target.id); if(!d){ pages.forEach(p=>URL.revokeObjectURL(p.url)); return; }
    try{
      const metas = await storePages(pages, typeById(d.typeId).imagesSensitive, (d.attachments||[]).length);
      if(_locked) return;
      d.attachments = (d.attachments||[]).concat(metas); d.updatedAt = new Date().toISOString();
      save();
      toast((metas.length===1 ? 'Added 1 file.' : 'Added '+metas.length+' files.') + problem);
    }catch(e){ console.error(e); toast('Couldn’t store that file on this phone.'); }
    finally{ pages.forEach(p=>URL.revokeObjectURL(p.url)); }
    const p = topPane(); if(p && p.screen==='detail' && p.id===d.id) renderSide(p);
  }
}
function discardPending(dr){ if(dr && dr.pending) dr.pending.forEach(p=>{ try{ URL.revokeObjectURL(p.url); if(p.fullUrl) URL.revokeObjectURL(p.fullUrl); }catch(e){} }); }

async function loadViewerContent(docId, index, hid){

      try{ pdf = await pdfDoc(bytes); }
      catch(e){ body.innerHTML = `<div style="color:#ccc;padding:40px;text-align:center">The PDF viewer couldn’t load. Connect to the internet once so it can be saved for offline use.</div>`; return; }
      body.innerHTML = '';
      const w = Math.min(body.clientWidth || 800, 1400) - 16;
      for(let n=1;n<=pdf.numPages;n++){
        if(!$('viewer-body')) return; // closed
        const c = await renderPdfPageToCanvas(pdf, n, w);

      }
    } else {
      const url = await urlFor(att, 'full');

    }
  }catch(e){
    console.warn(e);
    body.innerHTML = `<div style="color:#ccc;padding:40px;text-align:center">${e.message==='locked' ? 'This file is locked. Reveal it first.' : 'This file couldn’t be opened.'}</div>`;
  }
}
function attMenu(){

    <button class="opt danger" data-act="sheetChoice" data-i="2"><i class="ti ti-trash" aria-hidden="true"></i><div><div class="opt-t">Delete</div></div></button>`,

              choices:[()=>{ setAttsFor(v.docId, v.hid, attsFor(v.docId, v.hid).filter(a=>a.id!==att.id)); deleteAttachmentFiles([att]); save();
                pop(); if(topEntry() && topEntry().viewer) pop(); const p = topPane(); if(p) renderSide(p); toast('Deleted'); }] }); },
    ] });
}
async function setAttachmentSensitive(d, att, on){
  try{
    const bytes = await readFile(att.id);
    let thumb = null;
    if(!on && att.kind==='image' && typeof createImageBitmap==='function'){
      try{ const r = await compressImage(new Blob([bytes], { type:att.mime })); thumb = r.thumb; }catch(e){}
    } else if(!on && att.kind==='pdf') thumb = await pdfThumb(bytes);
    // a new file id, so the next sync uploads this copy and removes the old one from GitHub
    const oldAtt = Object.assign({}, att), id = 'f'+uid();
    await writeFile(id, bytes, on);
    if(!on && thumb) await writeFile(id+':t', thumb, false);
    Object.assign(att, { id, sensitive:on, hasThumb:!on && !!thumb, updatedAt:new Date().toISOString() });
    delete att.remote; delete att.syncSkipped; delete att.missing;
    if(on) delete att.userUnlocked; else att.userUnlocked = true;
    deleteAttachmentFiles([oldAtt]);
    d.updatedAt = new Date().toISOString(); save();
    toast(on ? 'Now treated as sensitive' : 'No longer sensitive');
    const v = topEntry(); if(v && v.viewer){ if(on && !isRevealedFor(d.id)) pop(); else renderSheet(true); }
    const p = topPane(); if(p) renderSide(p);
  }catch(e){
    if(e.message==='locked'){ toast('Reveal it first to change this.'); return; }
    console.error(e); toast('Couldn’t change it.');
  }
}

/* =====================================================================================
   SCANNING (M4) — reading details from photos and PDFs, entirely on the phone.
   • Text: Tesseract.js (code + English data downloaded once from jsDelivr, then cached).
     PDFs use their own text layer when they have one.
   • Passport / ID code strip (MRZ, ICAO 9303 TD1/TD2/TD3): its check digits make the number and
     expiry date "Verified". Everything else found in ordinary text is marked "Check".
   • Nothing is saved until you press Save on the Check details form.
   ===================================================================================== */

/* ----- MRZ ----- */
const MRZ_W = [7,3,1];
function mrzVal(c){ if(c==='<') return 0; if(c>='0' && c<='9') return c.charCodeAt(0)-48; if(c>='A' && c<='Z') return c.charCodeAt(0)-55; return -1; }
function mrzCheck(str){ let s = 0; for(let i=0;i<str.length;i++){ const v = mrzVal(str[i]); if(v<0) return -1; s += v*MRZ_W[i%3]; } return s%10; }
function mrzNum(s){ return s.replace(/O|Q|D/g,'0').replace(/[IL]/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8').replace(/G/g,'6').replace(/T/g,'7'); }
function cleanMrzLine(l){ return String(l).toUpperCase().replace(/[«‹(\[{]/g,'<').replace(/\s+/g,'').replace(/[^A-Z0-9<]/g,''); }
function fitLen(l, n){ return l.length >= n ? l.slice(0, n) : l + '<'.repeat(n - l.length); }
function checkOk(field, cd){ const c = mrzCheck(field); return c >= 0 && String(c) === mrzNum(cd); }
function mrzDate(yymmdd, future){
  const s = mrzNum(yymmdd); if(!/^\d{6}$/.test(s)) return '';
  const yy = +s.slice(0,2), mm = +s.slice(2,4), dd = +s.slice(4,6);
  const y = future ? 2000+yy : (yy > (new Date().getFullYear()%100) ? 1900+yy : 2000+yy);
  const d = new Date(y, mm-1, dd);
  return d.getMonth()===mm-1 && d.getDate()===dd ? toISO(d) : '';
}
// Tries the raw document number, then a digits-normalised copy, against its check digit.
function mrzDocNo(raw, cd){
  if(checkOk(raw, cd)) return { value:raw, ok:true };
  const alt = raw.replace(/O/g,'0');
  if(alt!==raw && checkOk(alt, cd)) return { value:alt, ok:true };
  return { value:raw, ok:false };
}
const COUNTRY = { KEN:'Kenya', UGA:'Uganda', TZA:'Tanzania', RWA:'Rwanda', BDI:'Burundi', ETH:'Ethiopia', SOM:'Somalia', SSD:'South Sudan', SDN:'Sudan', ZAF:'South Africa', NGA:'Nigeria', GHA:'Ghana', EGY:'Egypt', MAR:'Morocco',
  GBR:'United Kingdom', GBD:'United Kingdom', IRL:'Ireland', USA:'United States', CAN:'Canada', AUS:'Australia', NZL:'New Zealand', IND:'India', PAK:'Pakistan', ARE:'United Arab Emirates', SAU:'Saudi Arabia', QAT:'Qatar', OMN:'Oman',
  DEU:'Germany', D:'Germany', FRA:'France', ITA:'Italy', ESP:'Spain', NLD:'Netherlands', BEL:'Belgium', CHE:'Switzerland', SWE:'Sweden', NOR:'Norway', DNK:'Denmark', CHN:'China', JPN:'Japan', TUR:'Turkey', UTO:'Utopia' };
function countryName(code){ const c = String(code||'').replace(/</g,''); return COUNTRY[c] || c; }
function findMrz(text){
  const lines = String(text||'').split(/\r?\n/).map(cleanMrzLine).filter(l=>l.length>=26 && l.length<=48 && l.indexOf('<')>=0);
  for(let i=0;i<lines.length;i++){
    const a = lines[i], b = lines[i+1], c = lines[i+2];
    // TD1 (ID cards): 3 × 30
    if(b && c && Math.abs(a.length-30)<=3 && Math.abs(b.length-30)<=3 && /^[IAC]/.test(a)){
      const l1 = fitLen(a,30), l2 = fitLen(b,30), l3 = fitLen(c,30);
      const doc = mrzDocNo(l1.slice(5,14), l1[14]);
      const expOk = checkOk(mrzNum(l2.slice(8,14)), l2[14]);
      return { format:'TD1', type:'national-id', issuer:l1.slice(2,5), ref:doc.value.replace(/<+$/,''), refOk:doc.ok,
        expiry:mrzDate(l2.slice(8,14), true), expiryOk:expOk, nationality:l2.slice(15,18), names:parseMrzNames(l3) };
    }
    // TD3 (passports) 2 × 44, TD2 / MRV-B 2 × 36
    if(b && /^[PVAIC]/.test(a)){
      const n = Math.abs(a.length-44)<=3 && Math.abs(b.length-44)<=3 ? 44 : (Math.abs(a.length-36)<=3 && Math.abs(b.length-36)<=3 ? 36 : 0);
      if(!n) continue;
      const l1 = fitLen(a,n), l2 = fitLen(b,n);
      const doc = mrzDocNo(l2.slice(0,9), l2[9]);
      const expOk = checkOk(mrzNum(l2.slice(21,27)), l2[27]);
      const type = l1[0]==='P' ? 'passport' : l1[0]==='V' ? 'visa' : 'national-id';
      return { format: n===44 ? 'TD3' : 'TD2', type, issuer:l1.slice(2,5), ref:doc.value.replace(/<+$/,''), refOk:doc.ok,
        expiry:mrzDate(l2.slice(21,27), true), expiryOk:expOk, nationality:l2.slice(10,13), names:parseMrzNames(l1.slice(5)) };
    }
  }
  return null;
}
function parseMrzNames(s){
  const [sur, giv] = String(s||'').split('<<');
  const clean = x=>String(x||'').replace(/</g,' ').replace(/\s+/g,' ').trim();
  return { surname:clean(sur), given:clean(giv) };
}

/* ----- bank cards ----- */
function luhn(d){ let s = 0, alt = false; for(let i=d.length-1;i>=0;i--){ let n = d.charCodeAt(i)-48; if(alt){ n *= 2; if(n>9) n -= 9; } s += n; alt = !alt; } return s%10===0; }
function findCardNumber(text){
  const t = String(text||'').toUpperCase();
  const cands = t.match(/(?:[0-9OIL][ \-]?){13,19}/g) || [];
  for(const c of cands){
    const d = c.replace(/[ \-]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
    if(d.length>=13 && d.length<=19 && !/^(\d)\1+$/.test(d) && luhn(d)) return { value: d.replace(/(.{4})/g,'$1 ').trim(), raw:c };
  }
  return null;
}
function findCardExpiry(text){
  const t = String(text||'').toUpperCase();
  const re = /(?:^|[^0-9\/])(0[1-9]|1[0-2])\s?[\/\-]\s?(\d{4}|\d{2})(?![0-9\/])/g;
  let m, best = null;
  while((m = re.exec(t))){
    const y = m[2].length===2 ? 2000 + +m[2] : +m[2];
    if(y < 2000 || y > 2100) continue;
    const iso = toISO(new Date(y, +m[1], 0));
    if(!best || iso > best.iso) best = { iso, raw:m[1]+'/'+m[2] };
  }
  return best;
}

/* ----- dates ----- */
const MON = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, SEPT:9, OCT:10, NOV:11, DEC:12 };
const MON_RE = 'JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEPT|SEP|OCT|NOV|DEC';
function fullYear(y){ y = +y; return y < 100 ? (y < 70 ? 2000+y : 1900+y) : y; }
function mkISO(y, m, d){ const dt = new Date(fullYear(y), m-1, d); return (dt.getMonth()===m-1 && dt.getDate()===+d && m>=1 && m<=12) ? toISO(dt) : ''; }
function findDates(text, fmt){
  const t = String(text||'').toUpperCase(), out = [];
  const add = (iso, index, raw, alt)=>{ if(iso && !out.some(o=>o.index===index)) out.push({ iso, index, raw, alt:alt||'' }); };
  let m;
  const reNum = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})\b/g;
  while((m = reNum.exec(t))){
    const a = +m[1], b = +m[2];
    const dmy = mkISO(m[3], b, a), mdy = mkISO(m[3], a, b);
    const first = fmt==='MDY' ? (mdy||dmy) : (dmy||mdy);
    const other = first===dmy ? mdy : dmy;
    add(first, m.index, m[0], (a<=12 && b<=12 && a!==b && other) ? other : '');
  }
  const reIso = /\b(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/g;
  while((m = reIso.exec(t))) add(mkISO(m[1], +m[2], +m[3]), m.index, m[0]);
  const reDMon = new RegExp('\\b(\\d{1,2})(?:ST|ND|RD|TH)?[\\s.\\-\\/]*('+MON_RE+')[A-Z]*\\.?(?:\\/[A-Z]{3,5})?[\\s.,\\-\\/]*(\\d{4}|\\d{2})\\b', 'g');
  while((m = reDMon.exec(t))) add(mkISO(m[3], MON[m[2]], +m[1]), m.index, m[0]);
  const reMonD = new RegExp('\\b('+MON_RE+')[A-Z]*\\.?\\s+(\\d{1,2})(?:ST|ND|RD|TH)?,?\\s+(\\d{4})\\b', 'g');
  while((m = reMonD.exec(t))) add(mkISO(m[3], MON[m[1]], +m[2]), m.index, m[0]);
  return out.sort((x,y)=>x.index-y.index);
}
const EXPIRY_KW = /(EXPIR|EXP\b|EXP\.|VALID\s*(UNTIL|TILL|TO|THRU|THROUGH)|END\s*DATE|RENEWAL\s*DATE|DUE\s*DATE|\bTO\s*:?\s*$|\bUNTIL\s*:?\s*$|\bTILL\s*:?\s*$|DATE\s*OF\s*EXPIRY)/;
const ISSUE_KW = /(ISSU|START|FROM\s*:?\s*$|EFFECTIVE|COMMENC|DATE\s*OF\s*ISSUE|REGISTERED)/;
const BIRTH_KW = /(BIRTH|\bDOB\b|BORN|D\.O\.B)/;
function pickDates(text, dates){
  const t = String(text||'').toUpperCase();
  // the label is the text before the date on the same line (or the line above, for labels printed over values)
  const ctx = d => {
    const ls = t.lastIndexOf('\n', d.index-1) + 1;
    let c = t.slice(ls, d.index);
    if(!c.trim() && ls > 0){ const ps = t.lastIndexOf('\n', ls-2) + 1; c = t.slice(ps, ls); }
    return c.slice(-40).replace(/\s+/g,' ');
  };
  const usable = dates.filter(d=>!BIRTH_KW.test(ctx(d)));
  let expiry = usable.filter(d=>EXPIRY_KW.test(ctx(d))).pop();
  let issue = usable.find(d=>ISSUE_KW.test(ctx(d)) && d!==expiry);
  // no expiry label: the latest date that isn't labelled as an issue/start date
  if(!expiry){ const rest = usable.filter(d=>d!==issue && !ISSUE_KW.test(ctx(d))); if(rest.length) expiry = rest.sort((a,b)=>a.iso<b.iso?1:-1)[0]; }
  if(!issue){ const earlier = usable.filter(d=>d!==expiry && (!expiry || d.iso < expiry.iso)).sort((a,b)=>a.iso<b.iso?-1:1); issue = earlier[0]; }
  if(issue && expiry && issue.iso >= expiry.iso) issue = null;
  return { expiry:expiry||null, issue:issue||null };
}

/* ----- type, reference, issuer ----- */
function detectType(t, mrz, card){
  if(mrz) return mrz.type;
  if(card) return 'bank-card';
  if(/INSURANCE|ASSURANCE|POLICY\s*(NO|NUMBER|SCHEDULE)|CERTIFICATE\s*OF\s*INSURANCE/.test(t)) return 'insurance';
  if(/DRIV(ING|ER'?S?)\s*LICEN[CS]E|DRIVING\s*PERMIT/.test(t)) return 'drivers-licence';
  if(/LOG\s*BOOK|VEHICLE\s*REGISTRATION|REGISTRATION\s*CERTIFICATE|MOTOR\s*VEHICLE|CHASSIS/.test(t)) return 'vehicle-registration';
  if(/\bVISA\b|WORK\s*PERMIT|RESIDENCE\s*PERMIT|RESIDENT\s*PERMIT/.test(t)) return 'visa';
  if(/PASSPORT/.test(t)) return 'passport';
  if(/IDENTITY\s*CARD|NATIONAL\s*ID|IDENTIFICATION\s*CARD|\bID\s*CARD/.test(t)) return 'national-id';
  return null;
}
const REF_RE = {
  'passport': [/PASSPORT\s*(?:NO|NUMBER|N[O°º])\.?\s*[:\-]?\s*([A-Z]{0,2}\d{6,9}[A-Z]?)/],
  'national-id': [/(?:ID|IDENTITY|CARD|PERSONAL)\s*(?:NO|NUMBER|N[O°º])\.?\s*[:\-]?\s*([A-Z0-9]{5,14})/],
  'drivers-licence': [/LICEN[CS]E\s*(?:NO|NUMBER)\.?\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]{4,15})/, /\bDL\s*(?:NO)?\.?\s*[:\-]?\s*([A-Z0-9\-]{5,15})/],
  'insurance': [/(?:POLICY|CERTIFICATE|CERT)\s*(?:NO|NUMBER|#)\.?\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]{3,23})/],
  'vehicle-registration': [/(?:REG(?:ISTRATION)?\.?\s*(?:NO|NUMBER|MARK)|PLATE\s*(?:NO|NUMBER)?)\.?\s*[:\-]?\s*([A-Z]{1,3}\s?\d{1,4}\s?[A-Z]{0,3})\b/, /\b([A-Z]{3}\s\d{3}[A-Z])\b/],
  'visa': [/(?:VISA|PERMIT)\s*(?:NO|NUMBER)\.?\s*[:\-]?\s*([A-Z0-9]{5,14})/],
  'other': [/(?:REF(?:ERENCE)?|NUMBER|\bNO)\.?\s*[:\-]\s*([A-Z0-9][A-Z0-9\-\/]{3,19})/],
};
function findRef(t, type){
  for(const re of (REF_RE[type]||[]).concat(type==='other'?[]:REF_RE.other)){
    const m = re.exec(t); if(m) return m[1].trim();
  }
  return '';
}
function findIssuer(text, type){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const pick = re => { const l = lines.find(x=>re.test(x.toUpperCase()) && x.length<=48); return l ? l.replace(/\s+/g,' ') : ''; };
  if(type==='insurance') return pick(/INSURANCE|ASSURANCE/);
  if(type==='bank-card') return pick(/BANK/);
  if(type==='drivers-licence' || type==='vehicle-registration') return pick(/AUTHORITY|NTSA|DVLA|TRANSPORT|MINISTRY/);
  return '';
}
function titleCase(s){ return String(s).toLowerCase().replace(/\b[a-z]/g, c=>c.toUpperCase()); }

/* ----- where on the page a value was read (for the highlight) ----- */
function normTok(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9<]/g,''); }
function boxFor(value, words){
  if(!value || !words || !words.length) return null;
  const toks = String(value).split(/[\s\/\-]+/).map(normTok).filter(Boolean);
  if(!toks.length) return null;
  for(let i=0;i<words.length;i++){
    if(normTok(words[i].text).indexOf(toks[0])<0) continue;
    let j = i, k = 1, b = Object.assign({}, words[i].bbox);
    while(k < toks.length && j+1 < words.length && normTok(words[j+1].text).indexOf(toks[k])>=0 && words[j+1].page===words[i].page){
      j++; k++; const w = words[j].bbox; b = { x0:Math.min(b.x0,w.x0), y0:Math.min(b.y0,w.y0), x1:Math.max(b.x1,w.x1), y1:Math.max(b.y1,w.y1) };
    }
    return { page:words[i].page||0, bbox:b };
  }
  return null;
}
function mrzBox(words){
  const ws = (words||[]).filter(w=>/<</.test(w.text||''));
  if(!ws.length) return null;
  const b = ws.reduce((a,w)=>({ x0:Math.min(a.x0,w.bbox.x0), y0:Math.min(a.y0,w.bbox.y0), x1:Math.max(a.x1,w.bbox.x1), y1:Math.max(a.y1,w.bbox.y1) }), Object.assign({}, ws[0].bbox));
  return { page:ws[0].page||0, bbox:b };
}

/* ----- putting it together ----- */
// Returns { type, fields:{key:{value, source, alt, box}}, mrz, names }
function analyzeText(text, words, opts){
  opts = opts || {};
  const t = String(text||'').toUpperCase();
  const fields = {};
  const set = (key, value, source, extra)=>{ if(value) fields[key] = Object.assign({ value, source }, extra||{}); };
  const mrz = findMrz(text);
  const card = mrz ? null : findCardNumber(text);
  const type = opts.typeHint || detectType(t, mrz, card);
  if(mrz){
    const mb = mrzBox(words);
    set('ref', mrz.ref, mrz.refOk ? 'verified' : 'check', { box: boxFor(mrz.ref, words) || mb });
    set('expiry', mrz.expiry, mrz.expiryOk ? 'verified' : 'check', { box: mb });
    set('issuer', countryName(mrz.issuer), 'check', { box: mb });
  }
  if(type==='bank-card'){
    if(card) set('ref', card.value, 'check', { box: boxFor(card.value, words) });
    const ce = findCardExpiry(text);
    if(ce) set('expiry', ce.iso, 'check', { box: boxFor(ce.raw, words), month:true });
  }
  if(!fields.expiry || !fields.issueDate){
    const dates = pickDates(text, findDates(text, opts.dateFormat));
    if(!fields.expiry && dates.expiry) set('expiry', dates.expiry.iso, 'check', { alt:dates.expiry.alt, box: boxFor(dates.expiry.raw, words) });
    if(dates.issue) set('issueDate', dates.issue.iso, 'check', { alt:dates.issue.alt, box: boxFor(dates.issue.raw, words) });
  }
  if(!fields.ref && type){ const r = findRef(t, type); if(r) set('ref', r, 'check', { box: boxFor(r, words) }); }
  if(!fields.issuer && type){ const iss = findIssuer(text, type); if(iss) set('issuer', titleCase(iss), 'check', { box: boxFor(iss, words) }); }
  return { type, fields, mrz, names: mrz ? mrz.names : null };
}

/* ----- text from pages ----- */
let _tessP = null, _workerP = null, _ocrProgress = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!_tessP) _tessP = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = ()=>window.Tesseract ? res(window.Tesseract) : rej(new Error('The text reader couldn’t load.'));
    s.onerror = ()=>{ _tessP = null; s.remove(); rej(new Error('The text reader couldn’t load. Connect to the internet once so it can be saved for offline use.')); };
    document.head.appendChild(s);
  });
  return _tessP;
}
function getWorker(){
  if(!_workerP) _workerP = loadTesseract().then(T=>T.createWorker('eng', 1, { logger: m=>{ if(_ocrProgress && m && m.status==='recognizing text') _ocrProgress(m.progress); } }))
    .catch(e=>{ _workerP = null; throw e; });
  return _workerP;
}
function stopReader(){ if(_workerP){ const p = _workerP; _workerP = null; p.then(w=>w.terminate()).catch(()=>{}); } }
function wordsOf(data, page){
  return (data.words||[]).filter(w=>w && w.bbox && w.text).map(w=>({ text:w.text, bbox:{ x0:w.bbox.x0, y0:w.bbox.y0, x1:w.bbox.x1, y1:w.bbox.y1 }, page }));
}
async function ocrImage(page, index){
  const w = await getWorker();
  const blob = new Blob([page.bytes], { type:page.mime||'image/jpeg' });
  const r = await w.recognize(blob);
  let text = r.data.text || '', words = wordsOf(r.data, index);
  // A second, stricter pass over the bottom of the page for a passport / ID code strip
  if(/<<|PASSPORT|IDENTITY|P<|I<|\bID\b/i.test(text) && page.h){
    try{
      await w.setParameters({ tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<', tessedit_pageseg_mode:'6' });
      const top = Math.round(page.h*0.6);
      const r2 = await w.recognize(blob, { rectangle:{ left:0, top, width:page.w, height:page.h-top } });
      if(findMrz(r2.data.text)){ text = r2.data.text + '\n' + text; words = wordsOf(r2.data, index).concat(words); }
    }finally{
      await w.setParameters({ tessedit_char_whitelist:'', tessedit_pageseg_mode:'3' });
    }
  }
  return { text, words };
}
async function pdfText(page){
  const pdf = await pdfDoc(page.bytes);
  let text = '';
  for(let n=1;n<=Math.min(pdf.numPages, 3);n++){
    const tc = await (await pdf.getPage(n)).getTextContent();
    let lastY = null;
    for(const it of tc.items){ const y = it.transform ? Math.round(it.transform[5]) : null; text += (lastY!==null && y!==lastY ? '\n' : ' ') + it.str; lastY = y; }
    text += '\n';
  }
  return text;
}
async function readPage(page, index){
  if(page.kind==='pdf'){
    let text = '';
    try{ text = await pdfText(page); }catch(e){ text = ''; }
    if(text.replace(/\s/g,'').length > 20) return { text, words:[] };
    // scanned PDF: render page 1 and read it like a photo
    const pdf = await pdfDoc(page.bytes);
    const c = await renderPdfPageToCanvas(pdf, 1, 1600);
    const b = await canvasToBlob(c, 'image/jpeg', 0.9);
    return ocrImage({ bytes:new Uint8Array(await b.arrayBuffer()), mime:'image/jpeg', w:c.width, h:c.height }, index);
  }
  return ocrImage(page, index);
}

/* ----- reading into the Check details form ----- */
async function startReading(dr){
  const pages = (dr.pending||[]).slice(0, 3);
  if(!pages.length) return;
  dr.scan = { status:'reading', progress:0, sources:{}, boxes:{}, alts:{}, found:0 };
  if($('scan-status')) updateScanStatus(); else if(draft===dr) rerenderEditor(); // first time: show the status + "Check details" title
  let text = '', words = [];
  try{
    for(let i=0;i<pages.length;i++){
      _ocrProgress = p=>{ if(draft===dr && dr.scan){ dr.scan.progress = (i + p)/pages.length; updateScanStatus(); } };
      const r = await readPage(pages[i], i);
      if(draft!==dr) return;
      text += '\n' + r.text; words = words.concat(r.words);
    }
    applyScan(dr, analyzeText(text, words, { dateFormat: state.settings.dateFormat }));
    dr.scan.status = 'done';
  }catch(e){
    console.warn('Reading failed:', e);
    if(draft!==dr || !dr.scan) return;
    dr.scan.status = 'failed'; dr.scan.error = e.message || 'The text reader stopped.';
  }finally{ _ocrProgress = null; }
  if(draft===dr) refreshEditorAfterScan();
}
function applyScan(dr, res){
  if(res.type && !dr.typeTouched && res.type!==dr.typeId){
    const t = typeById(res.type);
    dr.typeId = t.id;
    if(!dr.remindersTouched) dr.reminders = t.reminders.map(r=>({id:uid(), amount:r.amount, unit:r.unit}));
  }
  dr.scan.typeFound = !!res.type;
  const t = typeById(dr.typeId);
  let found = 0;
  for(const [key, f] of Object.entries(res.fields)){
    const def = t.fields.find(x=>x.key===key); if(!def) continue;
    if(dr.values[key]) continue; // never overwrite what you typed
    let v = f.value;
    if(def.kind==='month' && /^\d{4}-\d{2}-\d{2}$/.test(v)) v = lastDayOfMonthISO(v.slice(0,7));
    dr.values[key] = v; found++;
    dr.scan.sources[key] = f.source;
    if(f.box) dr.scan.boxes[key] = f.box;
    if(f.alt) dr.scan.alts[key] = f.alt;
  }
  // owner from the code strip's given name, if it matches exactly one profile
  if(res.names && res.names.given && !dr.ownerTouched){
    const first = res.names.given.split(' ')[0].toLowerCase();
    const m = activeProfiles().filter(p=>p.name.trim().split(/\s+/)[0].toLowerCase()===first);
    if(m.length===1) dr.ownerId = m[0].id;
  }
  dr.scan.found = found;
  if(found) dr.dirty = true;
}

async function startCamera(){

// The frame guide sits over the part of the video that will be captured (ID-card shape).
const GUIDE_ASPECT = 1.5;
function guideRect(vw, vh){ let w = vw*0.92, h = w/GUIDE_ASPECT; if(h > vh*0.86){ h = vh*0.86; w = h*GUIDE_ASPECT; } return { x:(vw-w)/2, y:(vh-h)/2, w, h }; }
function layoutGuide(){
  const v = $('scan-video'), g = $('scan-guide'); if(!v || !g || !v.videoWidth) return;
  const box = v.getBoundingClientRect(), scale = Math.min(box.width/v.videoWidth, box.height/v.videoHeight);
  const dw = v.videoWidth*scale, dh = v.videoHeight*scale, ox = (box.width-dw)/2, oy = (box.height-dh)/2;
  const r = guideRect(v.videoWidth, v.videoHeight);
  Object.assign(g.style, { left:(ox + r.x*scale)+'px', top:(oy + r.y*scale)+'px', width:(r.w*scale)+'px', height:(r.h*scale)+'px' });
}

  const v = $('scan-video'); if(!v || !v.videoWidth){ toast('The camera isn’t ready yet.'); return; }
  const r = guideRect(v.videoWidth, v.videoHeight);
  const c = document.createElement('canvas'); c.width = Math.round(r.w); c.height = Math.round(r.h);
  c.getContext('2d').drawImage(v, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
  const b = await canvasToBlob(c, 'image/jpeg', 0.92); if(!b) return;

/* =====================================================================================
   CALENDAR REMINDERS (M5)
   Expiry can't wake itself up months from now, so reminders go into your phone's calendar as an
   .ics file (one event per reminder, with an alert). Each event's UID is stable
   (document + lead time), and SEQUENCE goes up on every export, so importing again updates
   events instead of duplicating them; removed reminders are sent as cancellations.
   Calendars sync to the cloud, so events carry no reference numbers — only type, owner, dates.
   ===================================================================================== */
const CAL_DOMAIN = 'expiry.app';
function ownerPossessive(d){
  const p = profileById(d.ownerId);
  if(!p || p.isSelf) return 'Your';
  return p.name.trim().split(/\s+/)[0] + '’s';
}
function docLink(id){ return location.origin + location.pathname + '#doc=' + encodeURIComponent(id); }
// The events a document should have in the calendar right now.
function calendarEvents(d, today){
  today = today || todayDate();
  const st = docStatus(d, today);
  if(st==='renewing'){
    const r = d.renewal || {};
    const due = parseISO(r.expectedBy);
    if(!due || daysBetween(today, due) < 0) return [];
    return [{ uid:`exp-${d.id}-followup@${CAL_DOMAIN}`, date:r.expectedBy, title:`Check on ${ownerPossessive(d).toLowerCase()} ${docTitleInline(d)} renewal`,
      desc:`The renewal you applied for on ${fmtDateLong(r.appliedOn)} was expected today. If it has arrived, open Expiry and choose Renew → I have the new one.` }];
  }
  if(st==='archived' || st==='expired') return [];
  const exp = parseISO(d.values.expiry); if(!exp) return [];
  const title = `${ownerPossessive(d)} ${docTitleInline(d)} expires ${fmtDateLong(d.values.expiry)}`;
  const t = typeById(d.typeId);
  const hint = t.id==='passport' ? ' Many countries need 6 months’ validity to enter, so start the renewal now.' : ' Start the renewal now.';
  const out = [];
  for(const r of (d.reminders||[])){
    const date = shiftDate(exp, -r.amount, r.unit);
    if(daysBetween(today, date) < 0) continue;
    out.push({ uid:`exp-${d.id}-${r.amount}${r.unit}@${CAL_DOMAIN}`, date:toISO(date), title, desc:`Reminder ${leadLabel(r)} before it expires.${hint}` });
  }
  if(!out.length && (d.reminders||[]).length){
    // every reminder date has passed but it hasn't expired: one reminder tomorrow
    const tm = shiftDate(today, 1, 'days');
    if(daysBetween(tm, exp) >= 0) out.push({ uid:`exp-${d.id}-soon@${CAL_DOMAIN}`, date:toISO(tm), title, desc:`It expires in ${daysBetween(today, exp)} days.${hint}` });
  }
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function calSig(d){ return JSON.stringify([calendarEvents(d).map(e=>[e.uid, e.date, e.title]), state.settings.reminderTime]); }
// 'none' (nothing to add) · 'missing' (never added) · 'stale' (changed since) · 'ok'
function calStatus(d){
  const evs = calendarEvents(d);
  if(!d.cal) return evs.length ? 'missing' : 'none';
  return d.cal.sig===calSig(d) ? 'ok' : 'stale';
}
function calNeedsUpdate(){ return state.documents.filter(d=>{ const s = calStatus(d); return s==='missing' || s==='stale'; }); }

/* ----- .ics text ----- */
function icsEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc = new TextEncoder();
  if(enc.encode(line).length <= 75) return line;
  const parts = []; let cur = '', bytes = 0, limit = 75;
  for(const ch of line){
    const b = enc.encode(ch).length;
    if(bytes + b > limit){ parts.push(cur); cur = ''; bytes = 0; limit = 74; } // continuation lines start with a space
    cur += ch; bytes += b;
  }
  parts.push(cur);
  return parts.join('\r\n ');
}
function icsStamp(d){ return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function icsLocal(iso, hhmm, plusMin){
  const [h, m] = (hhmm||'09:00').split(':').map(Number);
  const d = parseISO(iso); d.setHours(h, m + (plusMin||0), 0, 0);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
}
// Builds one calendar file for the given documents (+ cancellations for removed events).
function buildIcs(docs, opts){
  opts = opts || {};
  const now = icsStamp(new Date()), time = state.settings.reminderTime || '09:00';
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Expiry//Document reminders//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Expiry reminders'];
  const marks = []; let count = 0, cancelled = 0;
  const vevent = (uid, seq, date, title, desc, url, cancel)=>{
    L.push('BEGIN:VEVENT', 'UID:'+uid, 'DTSTAMP:'+now, 'SEQUENCE:'+seq,
      'DTSTART:'+icsLocal(date, time), 'DTEND:'+icsLocal(date, time, 15),
      'SUMMARY:'+icsEscape(title));
    if(cancel) L.push('STATUS:CANCELLED');
    else {
      L.push('DESCRIPTION:'+icsEscape(desc+'\nOpen in Expiry: '+url), 'URL:'+url, 'STATUS:CONFIRMED', 'TRANSP:TRANSPARENT',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:'+icsEscape(title), 'TRIGGER:PT0M', 'END:VALARM');
    }
    L.push('END:VEVENT');
  };
  for(const d of docs){
    const evs = calendarEvents(d);
    const seq = (d.cal ? d.cal.seq : 0) + 1;
    const url = docLink(d.id);
    evs.forEach(e=>{ vevent(e.uid, seq, e.date, e.title, e.desc, url, false); count++; });
    const keep = new Set(evs.map(e=>e.uid));
    for(const old of (d.cal && d.cal.uids) || []){
      if(keep.has(old.uid)) continue;
      vevent(old.uid, seq, old.date, old.title || 'Expiry reminder', '', url, true); cancelled++;
    }
    marks.push({ d, seq, uids:evs.map(e=>({ uid:e.uid, date:e.date, title:e.title })) });
  }
  const tombs = opts.includeTombstones ? (state.calTombstones||[]) : [];
  for(const tb of tombs){ vevent(tb.uid, tb.seq, tb.date, tb.title || 'Expiry reminder', '', '', true); cancelled++; }
  L.push('END:VCALENDAR');
  return { text: L.map(icsFold).join('\r\n') + '\r\n', count, cancelled, marks, tombs };
}
function markExported(res){
  const at = new Date().toISOString();
  for(const m of res.marks) m.d.cal = { seq:m.seq, uids:m.uids, sig:calSig(m.d), at };
  if(res.tombs.length) state.calTombstones = (state.calTombstones||[]).filter(t=>!res.tombs.includes(t));
  save();
}
// Deleted documents: their events must be cancelled on the next export.
function tombstoneCalendar(d){
  if(!d.cal || !d.cal.uids || !d.cal.uids.length) return;
  state.calTombstones = (state.calTombstones||[]).concat(d.cal.uids.map(u=>({ uid:u.uid, date:u.date, title:u.title, seq:d.cal.seq+1 })));
}

/* ----- handing the file to the phone ----- */
function calFile(text){ return new File([text], 'expiry-reminders.ics', { type:'text/calendar' }); }
function canShareFile(f){ try{ return !!(navigator.canShare && navigator.share && navigator.canShare({ files:[f] })); }catch(e){ return false; } }
function downloadFile(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = file.name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 15000);
}
// Sheet listing what will be added, with Download / Share. docs: array (one doc or all).
function openCalendarSheet(docs, opts){
  opts = opts || {};
  const res = buildIcs(docs, { includeTombstones: !!opts.all });

  const evs = docs.flatMap(d=>calendarEvents(d).map(e=>e));
  const list = evs.slice(0, 6).map(e=>`<div class="kv"><span class="k">${esc(fmtDate(e.date))}</span><span class="v" style="font-weight:400">${esc(e.title)}</span></div>`).join('');

      ${share?`<button class="btn" style="width:100%;margin-bottom:8px" data-act="calShare"><i class="ti ti-share" aria-hidden="true"></i>Share file…</button>`:''}
      <button class="btn" style="width:100%" data-act="back">Later</button>` };

async function calDeliver(how){
  const e = topEntry(); if(!e || !e.calendar) return;
  const file = calFile(e.res.text);

    try{ expectExternalUi(); await navigator.share({ files:[file], title:'Expiry reminders' }); }

/* =====================================================================================
   RENEW (M6) — three paths from the Renew button, a row swipe, or a calendar link:
   1. I have the new one → scan/enter it; the current version (values, sealed values, images)
      moves into d.history, reminders are recalculated, the calendar is offered an update.
   2. Renewal in progress → d.state 'renewing' + d.renewal {appliedOn, appRef, expectedBy, note};
      expiry reminders pause and one follow-up reminder is set for the expected-by date.
   3. Not renewing → d.state 'archived' with a reason; reminders stop.
   ===================================================================================== */
const NOT_RENEWING_REASONS = ['Sold', 'Cancelled', 'Replaced by another document', 'Lost or stolen', 'No longer needed'];

function attsFor(docId, hid){
  const d = docById(docId); if(!d) return [];
  if(!hid) return d.attachments || [];
  const h = (d.history||[]).find(x=>x.id===hid);
  return h ? (h.attachments || []) : [];
}
function setAttsFor(docId, hid, arr){
  const d = docById(docId); if(!d) return;
  if(!hid){ d.attachments = arr; return; }
  const h = (d.history||[]).find(x=>x.id===hid); if(h) h.attachments = arr;
}

// Draft for the new version: same type and owner; the fields that change on renewal start empty,
// with the old values shown underneath as "Before".
function renewDraft(d){
  const dr = draftFromDoc(d);
  dr.mode = 'renew'; dr.typeTouched = true; dr.ownerTouched = true; dr.pending = [];
  const t = typeById(d.typeId);
  dr.before = {}; dr.beforeRaw = Object.assign({}, d.values);
  for(const f of t.fields){
    if(f.key==='note' || !hasValue(d, f)) continue;
    dr.before[f.key] = f.sensitive ? maskedFor(d, f.key) : fieldDisplay(f, d.values[f.key]);
  }
  dr.beforeExpiry = d.values.expiry || '';
  for(const k of ['ref', 'issueDate', 'expiry']) delete dr.values[k];
  for(const k of Object.keys(dr.revealedPlain||{})) delete dr.values[k];
  dr.revealedPlain = {};
  return dr;
}
function beforeHTML(f){
  if(!draft || draft.mode!=='renew' || !draft.before || !draft.before[f.key]) return '';
  // unchanged (still the old value): nothing to compare
  if(!f.sensitive && draft.values[f.key] && draft.beforeRaw && draft.values[f.key]===draft.beforeRaw[f.key]) return '';
  const same = !f.sensitive && f.key!=='expiry' && f.key!=='issueDate' && !draft.values[f.key];
  let warn = '';
  if(f.key==='expiry' && draft.values.expiry && draft.beforeExpiry && draft.values.expiry <= draft.beforeExpiry)
    warn = `<div class="alt-note">The new expiry date is not after the old one. Check it before saving.</div>`;
  return `<div class="before">Before: <b>${esc(draft.before[f.key])}</b>${same?` <button class="mini-btn" data-act="sameAsBefore" data-key="${esc(f.key)}">Same as before</button>`:''}${f.sensitive?' · leave empty to keep it':''}</div>${warn}`;
}

/* ----- swipe a Home row left to renew ----- */
let _swipe = null, _suppressClick = false;
document.addEventListener('pointerdown', e=>{
  const row = e.target.closest && e.target.closest('#doc-list .row[data-act="openDoc"]');
  if(!row || e.pointerType==='mouse') return;
  _swipe = { row, id:row.dataset.id, x:e.clientX, y:e.clientY, dx:0, active:false };
});
document.addEventListener('pointermove', e=>{
  if(!_swipe) return;
  const dx = e.clientX - _swipe.x, dy = e.clientY - _swipe.y;
  if(!_swipe.active){ if(Math.abs(dy) > 12){ _swipe = null; return; } if(dx < -12) _swipe.active = true; else return; }
  _swipe.dx = Math.min(0, dx);
  _swipe.row.style.transform = `translateX(${Math.max(_swipe.dx, -120)}px)`;
  _swipe.row.classList.toggle('swipe-ready', _swipe.dx < -90);
});
function endSwipe(){
  if(!_swipe) return;
  const s = _swipe; _swipe = null;
  s.row.style.transform = ''; s.row.classList.remove('swipe-ready');
  if(s.active){ _suppressClick = true; setTimeout(()=>{ _suppressClick = false; }, 400); }
  if(s.dx < -90) openRenewSheet(s.id);
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', ()=>{ if(_swipe){ _swipe.row.style.transform = ''; _swipe = null; } });

/* =====================================================================================
   GITHUB SYNC (M7) — ported from Mandoos (guide §1–3, §10, §15) and extended for files.
   • Your secret Gist holds one file, expiry-state.json: the documents/profiles/settings,
     AES-GCM encrypted with a random sync key. The envelope's "auth" part holds that sync key and
     the sensitive vault's private key, each wrapped under your password (PBKDF2), so a new device
     needs only the password. Sensitive values inside stay sealed to the vault as on the phone.
   • Each photo/PDF goes in its own small secret Gist (created automatically), because the Gist API
     returns every file's content on each read: one big Gist would re-download every image on
     every sync. Normal files are re-encrypted with the sync key; sensitive ones stay sealed.
   • Three-way merge per document (base = what was last synced). Only a document changed
     differently on both sides needs a decision.
   • Connection details (token, Gist ID, sync key, base) live in expiry_sync, encrypted under
     the data key like the state. Calendar bookkeeping (d.cal) is per device and never synced.
   ===================================================================================== */
const SYNC_KEY = 'expiry_sync';
const GITHUB_API = 'https://api.github.com';
const STATE_FILE = 'expiry-state.json', FILE_MAIN = 'expiry-file.json', FILE_THUMB = 'expiry-thumb.json';
const MAX_SYNC_CHARS = 9 * 1024 * 1024;
let syncCfg = null;      // decrypted connection + bookkeeping (null when not connected or locked)
let _syncing = false, _autoTimer = null, _syncNote = '';

function saveSyncCfg(){ if(syncCfg && lockRec && _sessionKey) secureWrite(SYNC_KEY, JSON.stringify(syncCfg)); }
async function loadSyncCfg(key){
  try{
    const raw = localStorage.getItem(SYNC_KEY); if(!raw) return null;
    const p = JSON.parse(raw); if(!isEncBlob(p)) return null;
    return JSON.parse(new TextDecoder().decode(await decryptWith(key, p)));
  }catch(e){ return null; }
}

/* ----- GitHub API ----- */
function ghError(status){
  if(status===401) return 'GitHub rejected the access token. It may be wrong or expired.';
  if(status===404) return 'That Gist wasn’t found. Check the Gist ID (and that the token belongs to the same account).';
  if(status===403 || status===429) return 'GitHub refused the request (rate limit or token permissions). Try again shortly.';
  if(status===422) return 'GitHub couldn’t accept that file.';
  return 'GitHub returned an error ('+status+').';
}
async function gh(method, path, body, token){
  let res;
  try{
    res = await fetch(GITHUB_API + path, { method, headers: Object.assign({ 'Authorization':'token ' + (token || syncCfg.token), 'Accept':'application/vnd.github+json' }, body ? { 'Content-Type':'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
  }catch(e){ const x = new Error('Couldn’t reach GitHub. Check your connection.'); x.offline = true; throw x; }
  if(!res.ok){ const e = new Error(ghError(res.status)); e.status = res.status; throw e; }
  return res.status===204 ? null : res.json();
}
async function ghFileText(f){
  if(!f) return '';
  if(f.truncated && f.raw_url){ const r = await fetch(f.raw_url); if(!r.ok) throw new Error('Couldn’t download a file from GitHub.'); return r.text(); }
  return f.content || '';
}

/* ----- envelope ----- */
function isEnvelope(o){ return !!(o && o.expiryEncrypted===1 && typeof o.iv==='string' && typeof o.ct==='string' && o.auth); }
function syncKeyObj(){ return crypto.subtle.importKey('raw', unb64(syncCfg.syncKey), { name:'AES-GCM' }, false, ['encrypt','decrypt']); }
async function makeAuth(password, syncKeyBytes, vaultPub, vaultPrivBytes){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const d = await derivePwd(password, salt, PBKDF2_ITER);
  return { salt:b64(salt), iter:PBKDF2_ITER, keyWrap: await encryptWith(d.kek, syncKeyBytes), vault:{ pub:vaultPub, privWrap: await encryptWith(d.kek, vaultPrivBytes) }, at:new Date().toISOString() };
}
async function openAuth(auth, password){
  try{
    const d = await derivePwd(password, unb64(auth.salt), auth.iter || PBKDF2_ITER);
    return { syncKey: new Uint8Array(await decryptWith(d.kek, auth.keyWrap)), vaultPriv: new Uint8Array(await decryptWith(d.kek, auth.vault.privWrap)) };
  }catch(e){ return null; }
}
async function makeEnvelope(obj){
  const e = await encryptWith(await syncKeyObj(), new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ expiryEncrypted:1, v:1, iv:e.iv, ct:e.ct, auth:syncCfg.auth });
}
async function openEnvelope(env){ return JSON.parse(new TextDecoder().decode(await decryptWith(await syncKeyObj(), env))); }

/* ----- what gets synced ----- */
function clone(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
function emptySync(){ return { v:1, profiles:[], types:[], documents:[], settings:{} }; }
const LOCAL_SETTINGS = ['summaryDismissed', 'lastBackupAt', 'lastBackupKind']; // per device
function syncableState(st){
  const settings = clone(st.settings||{}); LOCAL_SETTINGS.forEach(k=>delete settings[k]);
  return { v:1, profiles:clone(st.profiles||[]), types:clone(st.types||[]), settings,
    documents:(st.documents||[]).map(d=>{ const c = clone(d); delete c.cal; return c; }) };
}

/* ----- three-way merge (Mandoos §10) ----- */
function deepEqual(a, b){
  if(a===b) return true;
  if(a==null || b==null) return a===b;
  if(typeof a!=='object' || typeof b!=='object') return false;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  if(Array.isArray(a)){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(!deepEqual(a[i], b[i])) return false; return true; }
  const ka = Object.keys(a).filter(k=>a[k]!==undefined), kb = Object.keys(b).filter(k=>b[k]!==undefined);
  if(ka.length!==kb.length) return false;
  for(const k of ka){ if(!kb.includes(k) || !deepEqual(a[k], b[k])) return false; }
  return true;
}
function mapById(arr){ const m = new Map(); (arr||[]).forEach(x=>{ if(x && x.id!=null) m.set(x.id, x); }); return m; }
function mergeByIdThreeWay(baseArr, localArr, remoteArr, autoResolve){
  const B = mapById(baseArr), L = mapById(localArr), R = mapById(remoteArr);
  const ids = new Set([...B.keys(), ...L.keys(), ...R.keys()]);
  const merged = [], conflicts = [];
  ids.forEach(id=>{
    const b = B.get(id), l = L.get(id), r = R.get(id);
    const lc = !deepEqual(l, b), rc = !deepEqual(r, b);
    if(!lc && !rc){ if(l) merged.push(l); return; }
    if(lc && !rc){ if(l) merged.push(l); return; }
    if(!lc && rc){ if(r) merged.push(r); return; }
    if(l && r && deepEqual(l, r)){ merged.push(l); return; }
    if(!l && r){ merged.push(r); return; }  // deleted here, edited there: the edit wins
    if(l && !r){ merged.push(l); return; }  // edited here, deleted there: the edit wins
    if(!l && !r) return;
    if(autoResolve){ const c = autoResolve(id, l, r); if(c) merged.push(c); return; }
    conflicts.push({ id, base:b, local:l, remote:r });
  });
  return { merged, conflicts };
}
function mergeSettings(base, local, remote){
  base = base||{}; local = local||{}; remote = remote||{};
  const out = {};
  new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)]).forEach(k=>{
    const lc = !deepEqual(local[k], base[k]), rc = !deepEqual(remote[k], base[k]);
    out[k] = (!lc && rc) ? remote[k] : local[k];
  });
  return out;
}
function mergeStates(base, local, remote){
  const docs = mergeByIdThreeWay(base.documents, local.documents, remote.documents);
  return {
    merged:{ v:1,
      profiles: mergeByIdThreeWay(base.profiles, local.profiles, remote.profiles, (id,l)=>l).merged,
      types: mergeByIdThreeWay(base.types, local.types, remote.types, (id,l)=>l).merged,
      settings: mergeSettings(base.settings, local.settings, remote.settings),
      documents: docs.merged },
    conflicts: docs.conflicts };
}
// Every device creates its own "You" profile at setup; after a merge keep one (the one already on
// GitHub) and move documents from the others to it.
function dedupeSelf(merged, remote){
  const selves = merged.profiles.filter(p=>p.isSelf && !p.deleted);
  if(selves.length < 2) return;
  const keep = selves.find(p=>(remote.profiles||[]).some(r=>r.id===p.id)) || selves[0];
  const drop = new Set(selves.filter(p=>p!==keep).map(p=>p.id));
  merged.profiles = merged.profiles.filter(p=>!drop.has(p.id));
  merged.documents.forEach(d=>{ if(drop.has(d.ownerId)) d.ownerId = keep.id; });
}
function allAtts(docs){ const out = []; (docs||[]).forEach(d=>{ (d.attachments||[]).forEach(a=>out.push(a)); (d.history||[]).forEach(h=>(h.attachments||[]).forEach(a=>out.push(a))); }); return out; }
function applyMerged(merged){
  const before = new Map(state.documents.map(d=>[d.id, d]));
  const beforeAtts = allAtts(state.documents);
  state.profiles = clone(merged.profiles); state.types = clone(merged.types);
  state.settings = Object.assign(clone(merged.settings), LOCAL_SETTINGS.reduce((o,k)=>{ if(state.settings[k]!==undefined) o[k] = state.settings[k]; return o; }, {}));
  state.documents = merged.documents.map(d=>{ const c = clone(d); const old = before.get(d.id); if(old && old.cal) c.cal = old.cal; return c; });
  // documents deleted on the other device: cancel their calendar events here too
  before.forEach((d, id)=>{ if(!state.documents.some(x=>x.id===id)) tombstoneCalendar(d); });
  normalizeLoadedState(); applyTheme();
  const keep = new Set(allAtts(state.documents).map(a=>a.id));
  deleteAttachmentFiles(beforeAtts.filter(a=>!keep.has(a.id)));
  for(const k of Object.keys(_plain)) delete _plain[k];
  save();
  // a field made sensitive on another device: protect values entered here meanwhile
  sealPlainSensitive().then(n=>{ if(n) save(); }).catch(()=>{});
}

/* ----- files: one secret Gist each ----- */
async function fileForGist(rec){
  if(rec.mode==='vault') return JSON.stringify({ m:'vault', ek:b64(rec.ek), iv:b64(rec.iv), ct:b64(rec.ct) });
  const bytes = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:rec.iv }, _sessionKey, rec.ct));
  const e = await encBytes(await syncKeyObj(), bytes);
  return JSON.stringify({ m:'sync', iv:b64(e.iv), ct:b64(e.ct) });
}
async function storeFromGist(id, text){
  const o = JSON.parse(text);
  if(o.m==='vault'){ await idbPut({ id, mode:'vault', ek:unb64(o.ek).buffer, iv:unb64(o.iv), ct:unb64(o.ct).buffer }); return; }
  const bytes = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(o.iv) }, await syncKeyObj(), unb64(o.ct)));
  await writeFile(id, bytes, false);
}
async function syncFiles(baseDocs){
  const atts = allAtts(state.documents);
  const now = new Set(atts.map(a=>a.id));
  let up = 0, down = 0, removed = 0, skipped = 0;
  for(const a of allAtts(baseDocs)){
    if(a.remote && !now.has(a.id)){ try{ await gh('DELETE', '/gists/'+a.remote); removed++; }catch(e){ if(e.status!==404) throw e; } }
  }
  for(const a of atts){
    if(_locked || !syncCfg) return null;
    const rec = await idbGet(a.id);
    if(rec && !a.remote && !a.syncSkipped){
      const files = { [FILE_MAIN]:{ content: await fileForGist(rec) } };
      if(files[FILE_MAIN].content.length > MAX_SYNC_CHARS){ a.syncSkipped = true; skipped++; continue; }
      if(a.hasThumb){ const t = await idbGet(a.id+':t'); if(t) files[FILE_THUMB] = { content: await fileForGist(t) }; }
      const g = await gh('POST', '/gists', { description:'Expiry: encrypted file (do not edit)', public:false, files });
      a.remote = g.id; up++;
    } else if(!rec && a.remote){
      try{
        const g = await gh('GET', '/gists/'+a.remote);
        await storeFromGist(a.id, await ghFileText(g.files[FILE_MAIN]));
        if(g.files[FILE_THUMB]) await storeFromGist(a.id+':t', await ghFileText(g.files[FILE_THUMB]));
        down++;
      }catch(e){ if(e.status===404){ a.missing = true; continue; } throw e; }
    } else if(a.syncSkipped) skipped++;
  }
  return { up, down, removed, skipped };
}

/* ----- sync ----- */
async function syncNow(opts){
  opts = opts || {};
  if(_syncing || !syncCfg || _locked) return { ok:false };
  if(!opts.interactive && typeof navigator.onLine==='boolean' && !navigator.onLine) return { ok:false };
  _syncing = true; _syncNote = 'Syncing…'; renderSyncBits();
  const cfg = syncCfg;
  try{
    const gist = await gh('GET', '/gists/'+encodeURIComponent(cfg.gistId));
    if(_locked || syncCfg!==cfg) return { ok:false };
    const f = gist.files && gist.files[STATE_FILE];
    const text = (await ghFileText(f)).trim();
    let remote = emptySync();
    if(text && text!=='{}'){
      let env; try{ env = JSON.parse(text); }catch(e){ throw new Error('The copy on GitHub is damaged. Nothing was changed.'); }
      if(!isEnvelope(env)) throw new Error('That Gist has content Expiry didn’t write. Nothing was changed.');
      try{ remote = await openEnvelope(env); }catch(e){ throw new Error('Couldn’t decrypt the copy on GitHub. Disconnect and connect again with your password.'); }
      // password changed on another device: adopt its newer wrapping unless ours is newer and unsent
      if(!cfg.authDirty && !deepEqual(env.auth, cfg.auth)) cfg.auth = env.auth;
    }
    const base = cfg.baseState || emptySync();
    const local = syncableState(state);
    const { merged, conflicts } = mergeStates(base, local, remote);
    if(conflicts.length){
      if(!opts.interactive){ cfg.pendingConflicts = conflicts.length; saveSyncCfg(); _syncNote = ''; return { ok:false, conflicts:conflicts.length }; }
      const pick = await askConflicts(conflicts);
      if(_locked || syncCfg!==cfg) return { ok:false };
      if(!pick){ toast('Sync cancelled. Nothing was changed.'); _syncNote = ''; return { ok:false, cancelled:true }; }
      conflicts.forEach(c=>{ const w = pick[c.id]==='remote' ? c.remote : c.local; if(w) merged.documents.push(w); });
    }
    dedupeSelf(merged, remote);
    if(ui.profile!=='all' && !merged.profiles.some(p=>p.id===ui.profile)) ui.profile = 'all';
    applyMerged(merged);
    await lockTypeImages();
    const files = await syncFiles(base.documents);
    if(!files || _locked || syncCfg!==cfg) return { ok:false };
    save();
    const pushed = syncableState(state);
    await gh('PATCH', '/gists/'+encodeURIComponent(cfg.gistId), { files:{ [STATE_FILE]:{ content: await makeEnvelope(pushed) } } });
    if(_locked || syncCfg!==cfg) return { ok:false };
    cfg.baseState = pushed; cfg.lastSyncedAt = new Date().toISOString(); cfg.syncedSeq = cfg.localChangeSeq;
    cfg.pendingConflicts = 0; cfg.authDirty = false; cfg.lastError = '';
    saveSyncCfg();
    _syncNote = '';
    renderNav(true);
    if(opts.interactive){
      const bits = []; if(files.up) bits.push(files.up+' file'+(files.up===1?'':'s')+' uploaded'); if(files.down) bits.push(files.down+' downloaded'); if(files.skipped) bits.push(files.skipped+' too large to sync');
      toast('Synced' + (bits.length ? ' · ' + bits.join(' · ') : ''));
    }
    return { ok:true, files };
  }catch(e){
    console.warn('Sync failed:', e);
    if(syncCfg===cfg){ cfg.lastError = e.message; saveSyncCfg(); }
    _syncNote = '';
    if(opts.interactive) toast(e.message);
    return { ok:false, error:e.message };
  }finally{
    _syncing = false; renderSyncBits();
  }
}
function askConflicts(conflicts){
  return new Promise(resolve=>{
    const pick = {}; conflicts.forEach(c=>{ pick[c.id] = 'local'; });
    let done = false;
    const summary = d=>d ? `${esc(docTitle(d))} · expires ${esc(fmtDate(d.values && d.values.expiry))} · ${(d.attachments||[]).length} file(s)${d.updatedAt?' · changed '+esc(fmtDate(toISO(new Date(d.updatedAt)))):''}` : 'Deleted';
    const entry = { kind:'sheet', conflicts:true,
      render:()=>`<h3>Choose which version to keep</h3>
        <p class="sub">${conflicts.length===1?'This document was':'These documents were'} changed on this phone and on another device since the last sync.</p>
        ${conflicts.map(c=>`<div class="card" style="padding:8px 12px"><div class="row-title">${esc(docTitle(c.local||c.remote))}</div>
          <button class="opt${pick[c.id]==='local'?' picked':''}" data-act="conflictPick" data-id="${esc(c.id)}" data-v="local"><i class="ti ti-device-mobile" aria-hidden="true"></i><div><div class="opt-t">This phone</div><div class="opt-s">${summary(c.local)}</div></div></button>
          <button class="opt${pick[c.id]==='remote'?' picked':''}" data-act="conflictPick" data-id="${esc(c.id)}" data-v="remote"><i class="ti ti-cloud" aria-hidden="true"></i><div><div class="opt-t">Other device</div><div class="opt-s">${summary(c.remote)}</div></div></button></div>`).join('')}
        <div class="actions"><button class="btn" data-act="back">Cancel</button><button class="btn primary" data-act="conflictApply">Keep these and sync</button></div>`,
      pick, finish:v=>{ if(!done){ done = true; resolve(v); } }, onClose:()=>{ if(!done){ done = true; resolve(null); } } };
    openSheet(entry);
  });
}

/* ----- connecting ----- */
async function connectSync(gistId, token){
  gistId = String(gistId||'').trim().replace(/^https?:\/\/gist\.github\.com\/[^/]+\//,'').replace(/[/#?].*$/,'');
  token = String(token||'').trim();
  if(!/^[0-9a-f]{20,40}$/i.test(gistId)) return 'Enter the Gist ID: the long code at the end of the Gist’s address.';
  if(token.length < 20) return 'Enter your GitHub access token.';
  let gist;
  try{ gist = await gh('GET', '/gists/'+gistId, null, token); }catch(e){ return e.message; }
  const names = Object.keys(gist.files||{});
  const f = gist.files[STATE_FILE] || (names.length===1 ? gist.files[names[0]] : null);
  const text = f ? (await ghFileText(f)).trim() : '';
  let env = null;
  if(text && text!=='{}'){ try{ env = JSON.parse(text); }catch(e){ return 'That Gist has other content. Create a new secret Gist for Expiry.'; }
    if(!isEnvelope(env)) return 'That Gist has other content. Create a new secret Gist for Expiry.'; }
  const owner = gist.owner && gist.owner.login || '';
  if(!env){
    // first device: our vault, a new sync key, wrapped under this phone's password
    let pwd = null, kek = null;
    const ok = await askPassword({ title:'Confirm your password', message:'It protects the copy on GitHub. Your other devices will need this password to connect.',
      fields:[{ label:'Password', autocomplete:'current-password' }], okLabel:'Connect',
      submit: async v=>{ kek = await checkPwd(v[0]); if(!kek) return 'Incorrect password.'; pwd = v[0]; return null; } });
    if(!ok) return 'cancelled';
    const vaultPriv = new Uint8Array(await decryptWith(kek, lockRec.skWrap));
    const sk = crypto.getRandomValues(new Uint8Array(32));
    const auth = await makeAuth(pwd, sk, lockRec.skPub, vaultPriv);
    syncCfg = { gistId, token, owner, syncKey:b64(sk), auth, baseState:null, lastSyncedAt:null, localChangeSeq:1, syncedSeq:0, connectedAt:new Date().toISOString() };
  } else {
    // another device set it up: its password opens the sync key and the vault
    let opened = null, pwd = null;
    const ok = await askPassword({ title:'Enter your Expiry password', message:'Use the password from the device that set up sync. It opens the encrypted copy on GitHub.',
      fields:[{ label:'Password', autocomplete:'current-password' }], okLabel:'Connect',
      submit: async v=>{ opened = await openAuth(env.auth, v[0]); if(!opened) return 'Incorrect password for the copy on GitHub.'; pwd = v[0]; return null; } });
    if(!ok) return 'cancelled';
    if(env.auth.vault.pub !== lockRec.skPub){
      const res = await adoptVault(env.auth.vault.pub, opened.vaultPriv, pwd);
      if(res) return res;
    }
    syncCfg = { gistId, token, owner, syncKey:b64(opened.syncKey), auth:env.auth, baseState:null, lastSyncedAt:null, localChangeSeq:1, syncedSeq:0, connectedAt:new Date().toISOString() };
  }
  saveSyncCfg();
  await syncNow({ interactive:true });
  return null;
}
// Switch this phone to the synced vault so sensitive values from other devices can be revealed here.
// Anything already sealed on this phone is opened with the old vault and sealed again with the new one.
async function adoptVault(newPub, newPrivBytes, triedPwd){
  let kek = await checkPwd(triedPwd);
  if(!kek){
    const ok = await askPassword({ title:'This phone’s password', message:'This phone uses a different password. Enter it so its sensitive info can be moved to the synced keys.',
      fields:[{ label:'This phone’s password', autocomplete:'current-password' }], okLabel:'Continue',
      submit: async v=>{ kek = await checkPwd(v[0]); return kek ? null : 'Incorrect password.'; } });
    if(!ok || !kek) return 'cancelled';
  }
  try{
    const oldPriv = await importVaultPriv(new Uint8Array(await decryptWith(kek, lockRec.skWrap)));
    _skPubKey = await crypto.subtle.importKey('spki', unb64(newPub), { name:'RSA-OAEP', hash:'SHA-256' }, false, ['encrypt']);
    const reseal = async holder=>{ for(const k of Object.keys(holder.sealed||{})) holder.sealed[k] = await sealText(await openSealed(oldPriv, holder.sealed[k])); };
    for(const d of state.documents){
      await reseal(d); for(const h of (d.history||[])) await reseal(h);
      for(const a of allAtts([d])) if(a.sensitive){ const rec = await idbGet(a.id); if(rec && rec.mode==='vault'){ const s = await sealBytes(await openSealedBytes(oldPriv, rec)); await idbPut({ id:a.id, mode:'vault', ek:s.ek, iv:s.iv, ct:s.ct }); } }
    }
    const rec = Object.assign({}, lockRec, { skPub:newPub, skWrap: await encryptWith(kek, newPrivBytes) });
    localStorage.setItem(LOCK_REC_KEY, JSON.stringify(rec)); lockRec = rec;
    hideReveal();
    if(loadBio()){ localStorage.removeItem(BIO_KEY); setTimeout(()=>toast('Turn fingerprint unlock on again in Settings (the keys changed).'), 3500); }
    save();
    return null;
  }catch(e){ console.error(e); _skPubKey = null; return 'Couldn’t move this phone’s sensitive info to the synced keys. Nothing was connected.'; }
}
function disconnectSync(){
  syncCfg = null; clearTimeout(_autoTimer);
  try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
  renderSyncBits(); toast('Disconnected. Your documents stay on this phone; the copy on GitHub is unchanged.');
}
// Password changed here: re-wrap the GitHub copy's keys under the new password on the next push.
async function rewrapSyncAuth(newPwd, skBytes){
  if(!syncCfg) return;
  syncCfg.auth = await makeAuth(newPwd, unb64(syncCfg.syncKey), lockRec.skPub, skBytes);
  syncCfg.authDirty = true; syncCfg.localChangeSeq = (syncCfg.localChangeSeq||0) + 1;
  saveSyncCfg(); scheduleAutoSync(1000);
}

/* ----- automatic sync: shortly after changes, on unlock, and on return after 15 minutes ----- */
function noteLocalChange(){ if(!syncCfg) return; syncCfg.localChangeSeq = (syncCfg.localChangeSeq||0) + 1; saveSyncCfg(); scheduleAutoSync(); }
function scheduleAutoSync(delay){
  if(!syncCfg || window.EXPIRY_NO_AUTOSYNC) return;
  clearTimeout(_autoTimer);
  _autoTimer = setTimeout(()=>{ if(syncCfg && !_locked && !_syncing && syncCfg.localChangeSeq!==syncCfg.syncedSeq) syncNow({ interactive:false }); }, delay || 20000);
}
function maybeAutoSyncOnOpen(){

  if(Date.now() - last > 15*60000) setTimeout(()=>syncNow({ interactive:false }), 1500);
}
