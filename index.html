/* =====================================================================================
   BACKUP AND RESTORE (M8)
   • Encrypted backup (.expiry.json): documents, profiles, types, settings and every file, AES-GCM
     encrypted with a random backup key. The key and the sensitive vault's private key are wrapped
     under your password (same "auth" scheme as GitHub sync), so a fresh phone needs only that
     password. Sensitive values/images stay sealed to the vault inside.
   • Plain backup (.html): one self-contained page anyone can open or print — every document,
     its details (card numbers included), notes, reminders and images. NOT encrypted; it carries a
     warning, and Expiry can restore from it (the data is embedded as JSON in the page).
   • Restore: replace everything on this phone, or add to it (newer version of a document wins).
     Sealed values from another phone's vault are re-sealed to this phone's vault, so this phone's
     fingerprint and password keep working.
   • Never in any backup: the app password, the data key, GitHub token or calendar bookkeeping.
   ===================================================================================== */
const BACKUP_DIR_ID = '__backupDir';

function backupStamp(){ return toISO(todayDate()); }
function bytesToB64(bytes){ return b64(bytes); }

/* ----- encrypted ----- */
async function buildEncryptedBackup(pwd, kek){
  const vaultPriv = new Uint8Array(await decryptWith(kek, lockRec.skWrap));
  const bk = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', bk, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
  const files = {};
  for(const a of allAtts(state.documents)){
    for(const id of [a.id].concat(a.hasThumb ? [a.id+':t'] : [])){
      const rec = await idbGet(id); if(!rec) continue;
      if(rec.mode==='vault') files[id] = { m:'vault', ek:b64(rec.ek), iv:b64(rec.iv), ct:b64(rec.ct) };
      else { const bytes = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:rec.iv }, _sessionKey, rec.ct)); const e = await encBytes(key, bytes); files[id] = { m:'key', iv:b64(e.iv), ct:b64(e.ct) }; }
    }
  }
  const payload = { state: syncableState(state), files, gistId: syncCfg ? syncCfg.gistId : null };
  const e = await encryptWith(key, new TextEncoder().encode(JSON.stringify(payload)));
  const auth = await makeAuth(pwd, bk, lockRec.skPub, vaultPriv);
  const text = JSON.stringify({ expiryBackup:1, v:1, kind:'encrypted', createdAt:new Date().toISOString(),
    counts:{ documents:state.documents.length, files:Object.keys(files).filter(k=>!k.endsWith(':t')).length }, auth, iv:e.iv, ct:e.ct });
  return new File([text], `expiry-backup-${backupStamp()}.expiry.json`, { type:'application/json' });
}

/* ----- plain (readable HTML) ----- */
async function buildPlainBackup(kek){
  const priv = await importVaultPriv(new Uint8Array(await decryptWith(kek, lockRec.skWrap)));
  const readFileWith = async id=>{
    const rec = await idbGet(id); if(!rec) return null;
    if(rec.mode==='vault') return openSealedBytes(priv, rec);
    return new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:rec.iv }, _sessionKey, rec.ct));
  };
  const unseal = async holder=>{ const v = Object.assign({}, holder.values); for(const k of Object.keys(holder.sealed||{})){ try{ v[k] = await openSealed(priv, holder.sealed[k]); }catch(e){} } return v; };
  const st = syncableState(state);
  const files = {};
  for(const d of st.documents){
    d.values = await unseal(d); delete d.sealed; delete d.masks;
    for(const h of (d.history||[])){ h.values = await unseal(h); delete h.sealed; delete h.masks; }
    for(const a of allAtts([d])){
      delete a.remote;
      const b = await readFileWith(a.id); if(b) files[a.id] = { mime:a.mime, b64:bytesToB64(b) };
      if(a.hasThumb){ const t = await readFileWith(a.id+':t'); if(t) files[a.id+':t'] = { mime:'image/jpeg', b64:bytesToB64(t) }; }
    }
  }
  const data = { expiryBackup:1, v:1, kind:'plain', createdAt:new Date().toISOString(), state:st, files };
  const today = todayDate();
  const fileHTML = a=>{
    const f = files[a.id]; if(!f) return `<p class="muted">${esc(a.label)}: file missing</p>`;
    const src = `data:${esc(f.mime)};base64,${f.b64}`;
    return a.kind==='pdf' ? `<p><a download="${esc(a.name||a.label+'.pdf')}" href="${src}">${esc(a.label)} (PDF)</a></p>` : `<figure><img alt="${esc(a.label)}" src="${src}"><figcaption>${esc(a.label)}</figcaption></figure>`;
  };
  const fieldsHTML = (t, values)=>t.fields.filter(f=>f.key!=='note' && values[f.key]).map(f=>`<tr><th>${esc(f.label)}</th><td>${esc(fieldDisplay(f, values[f.key]))}</td></tr>`).join('');
  const docHTML = d=>{
    const t = typeById(d.typeId);
    const rem = reminderDates(d).map(r=>`${esc(r.lead)} before: ${esc(fmtDate(r.date))}`).join(' · ');
    return `<section class="doc"><h3>${esc(docTitle(d))} <small>${esc(t.name)} · ${esc(STATUS_LABEL[docStatus(d, today)])}</small></h3>
      <table>${fieldsHTML(t, d.values)}</table>
      ${d.values.note ? `<p class="note">${esc(d.values.note)}</p>` : ''}
      ${rem ? `<p class="muted">Reminders: ${rem}</p>` : ''}
      ${d.renewal ? `<p class="muted">Renewal in progress: applied ${esc(fmtDate(d.renewal.appliedOn))}${d.renewal.appRef?', ref. '+esc(d.renewal.appRef):''}${d.renewal.expectedBy?', expected '+esc(fmtDate(d.renewal.expectedBy)):''}</p>` : ''}
      <div class="files">${(d.attachments||[]).map(fileHTML).join('')}</div>
      ${(d.history||[]).length ? `<details><summary>${d.history.length} earlier version(s)</summary>${d.history.map(h=>`<div class="hist"><table>${fieldsHTML(typeById(h.typeId||d.typeId), h.values)}</table><div class="files">${(h.attachments||[]).map(fileHTML).join('')}</div></div>`).join('')}</details>` : ''}
    </section>`;
  };
  const people = st.profiles.filter(p=>!p.deleted);
  const orphans = st.documents.filter(d=>!people.some(p=>p.id===d.ownerId));
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expiry backup ${esc(fmtDate(backupStamp()))}</title>
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:20px;color:#222;line-height:1.45}
.warn{background:#fdecea;border:1px solid #e0a39b;color:#8a1f12;padding:12px 14px;border-radius:8px}
h2{border-bottom:2px solid #c9a227;padding-bottom:4px;margin-top:32px}.doc{border:1px solid #ddd;border-radius:10px;padding:12px 16px;margin:12px 0;page-break-inside:avoid}
h3 small{font-weight:400;color:#777;font-size:14px}table{border-collapse:collapse}th{text-align:left;color:#666;font-weight:400;padding:3px 16px 3px 0;vertical-align:top}td{padding:3px 0}
.muted{color:#777;font-size:14px}.note{white-space:pre-wrap;background:#f6f4ee;padding:8px;border-radius:6px}.files{display:flex;flex-wrap:wrap;gap:10px}
figure{margin:0;max-width:280px}figure img{max-width:100%;border:1px solid #ccc;border-radius:6px}figcaption{font-size:12px;color:#777}.hist{border-top:1px dashed #ccc;margin-top:8px;padding-top:8px}</style></head><body>
<h1>Expiry backup</h1>
<p class="muted">Made ${esc(fmtDate(backupStamp()))} · ${st.documents.length} document(s) · ${Object.keys(files).filter(k=>!k.endsWith(':t')).length} file(s)</p>
<p class="warn"><b>This backup is not encrypted.</b> Anyone who gets this file can read everything in it, including card numbers and passport and ID images. Keep it somewhere private. To restore it, open Expiry → Settings → Restore from backup.</p>
${people.map(p=>{ const ds = st.documents.filter(d=>d.ownerId===p.id); return `<h2>${esc(p.name)}${p.relation?` <small class="muted">${esc(p.relation)}</small>`:''}</h2>${ds.length ? ds.map(docHTML).join('') : '<p class="muted">No documents</p>'}`; }).join('')}
${orphans.length ? `<h2>Other</h2>${orphans.map(docHTML).join('')}` : ''}
<script type="application/json" id="expiry-backup-data">${JSON.stringify(data).replace(/</g,'\\u003c')}<\/script>
</body></html>`;
  return new File([html], `expiry-backup-${backupStamp()}-NOT-ENCRYPTED.html`, { type:'text/html' });
}

/* ----- making a backup (asks the password, then where to put it) ----- */
async function startBackup(kind){
  let pwd = null, kek = null;
  const ok = await askPassword({
    title: kind==='plain' ? 'Confirm your password' : 'Encrypted backup',
    message: kind==='plain' ? 'Needed to include card numbers and ID images.' : 'The backup is protected by this password. You’ll need it to restore, even if you change your password later.',
    fields:[{ label:'Password', autocomplete:'current-password' }], okLabel:'Make backup',
    submit: async v=>{ kek = await checkPwd(v[0]); if(!kek) return 'Incorrect password.'; pwd = v[0]; return null; } });
  if(!ok) return;
  toast('Preparing backup…');
  let file;
  try{ file = kind==='plain' ? await buildPlainBackup(kek) : await buildEncryptedBackup(pwd, kek); }
  catch(e){ console.error(e); toast('Couldn’t make the backup.'); return; }
  if(_locked) return;
  openSaveSheet(file, kind);
}
function openSaveSheet(file, kind){
  const folder = typeof window.showDirectoryPicker==='function';
  const share = canShareFile(file);
  openSheet({ backup:true, file, bkind:kind,
    render:()=>`<h3>${kind==='plain' ? 'Plain backup ready' : 'Encrypted backup ready'}</h3>
      <p class="sub">${esc(file.name)} · ${esc(bytesLabel(file.size))}</p>
      ${kind==='plain' ? `<div class="info" style="background:var(--red-bg);color:var(--red);border-color:var(--red)"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span>Not encrypted. Anyone with this file can read it.</span></div>` : ''}
      ${folder ? `<button class="btn primary" style="width:100%;margin-bottom:8px" data-act="backupFolder"><i class="ti ti-folder" aria-hidden="true"></i>${_backupDirName ? 'Save to “'+esc(_backupDirName)+'”' : 'Save to a folder…'}</button>` : ''}
      <button class="btn${folder?'':' primary'}" style="width:100%;margin-bottom:8px" data-act="backupDownload"><i class="ti ti-download" aria-hidden="true"></i>Download</button>
      ${share ? `<button class="btn" style="width:100%;margin-bottom:8px" data-act="backupShare"><i class="ti ti-share" aria-hidden="true"></i>Share or save to Drive…</button>` : ''}
      <button class="btn" style="width:100%" data-act="back">Close</button>` });
}
function markBackedUp(kind){
  state.settings.lastBackupAt = new Date().toISOString(); state.settings.lastBackupKind = kind;
  save(); renderHome(); const p = topPane(); if(p && p.screen==='settings') renderSide(p);
}

/* ----- folder (laptop: File System Access API; remembered between backups) ----- */
let _backupDirName = '', _backupDirHandle = null;
async function getBackupDir(pick){
  let handle = _backupDirHandle;
  if(!handle){ try{ const rec = await idbGet(BACKUP_DIR_ID); handle = rec && rec.handle; }catch(e){} }
  if(handle && !pick){
    try{
      const q = handle.queryPermission ? await handle.queryPermission({ mode:'readwrite' }) : 'granted';
      if(q==='granted' || (handle.requestPermission && await handle.requestPermission({ mode:'readwrite' })==='granted')){ _backupDirName = handle.name; _backupDirHandle = handle; return handle; }
    }catch(e){}
  }
  expectExternalUi();
  handle = await window.showDirectoryPicker({ id:'expiry-backups', mode:'readwrite', startIn:'documents' });
  _backupDirHandle = handle; _backupDirName = handle.name;
  try{ await idbPut({ id:BACKUP_DIR_ID, mode:'handle', handle }); }catch(e){} // remembered across visits where the browser allows it
  return handle;
}
async function saveToFolder(file, pick){
  const dir = await getBackupDir(pick);
  const fh = await dir.getFileHandle(file.name, { create:true });
  const w = await fh.createWritable(); await w.write(file); await w.close();
  return dir.name;
}
async function backupDeliver(how){
  const e = topEntry(); if(!e || !e.backup) return;
  try{
    if(how==='folder'){ const name = await saveToFolder(e.file, false); toast('Saved to “'+name+'”'); }
    else if(how==='share'){ expectExternalUi(); await navigator.share({ files:[e.file], title:'Expiry backup' }); toast('Shared'); }
    else { expectExternalUi(); downloadFile(e.file); toast('Downloaded to your Downloads folder'); }
  }catch(x){ if(x && x.name==='AbortError') return; console.warn(x); toast('Couldn’t save the backup there. Try Download.'); return; }
  markBackedUp(e.bkind);
  if(topEntry()===e) pop();
}
async function forgetBackupFolder(){ try{ await idbDelete([BACKUP_DIR_ID]); }catch(e){} _backupDirName = ''; _backupDirHandle = null; renderSide(topPane()); toast('Backup folder forgotten'); }
async function loadBackupDirName(){ try{ const r = await idbGet(BACKUP_DIR_ID); _backupDirName = r && r.handle ? r.handle.name : ''; }catch(e){ _backupDirName = ''; } }

/* ----- restore ----- */
function pickRestoreFile(){ const i = $('pick-restore'); i.value = ''; expectExternalUi(); i.click(); }
async function onRestorePicked(file){
  if(!file || _locked) return;
  let text;
  try{ text = await file.text(); }catch(e){ toast('Couldn’t read that file.'); return; }
  let backup = null;
  try{
    if(/^\s*</.test(text)){
      const m = /<script type="application\/json" id="expiry-backup-data">([\s\S]*?)<\/script>/.exec(text);
      if(m) backup = JSON.parse(m[1]);
    } else backup = JSON.parse(text);
  }catch(e){ backup = null; }
  if(!backup || backup.expiryBackup!==1 || !/^(encrypted|plain)$/.test(backup.kind)){ toast('That isn’t an Expiry backup file.'); return; }
  if(backup.kind==='encrypted'){
    let opened = null, payload = null;
    const ok = await askPassword({ title:'Backup password', message:'Enter the password Expiry had when this backup was made.',
      fields:[{ label:'Password', autocomplete:'current-password' }], okLabel:'Open backup',
      submit: async v=>{
        opened = await openAuth(backup.auth, v[0]); if(!opened) return 'Incorrect password for this backup.';
        try{ const key = await crypto.subtle.importKey('raw', opened.syncKey, { name:'AES-GCM' }, false, ['decrypt']);
          payload = JSON.parse(new TextDecoder().decode(await decryptWith(key, backup)));
          payload.key = key; payload.vaultPriv = await importVaultPriv(opened.vaultPriv); payload.vaultPub = backup.auth.vault.pub;
        }catch(e){ return 'The backup is damaged and can’t be opened.'; }
        return null; } });
    if(!ok || !payload) return;
    payload.kind = 'encrypted'; payload.createdAt = backup.createdAt;
    restoreChoiceSheet(payload);
  } else {
    restoreChoiceSheet({ kind:'plain', createdAt:backup.createdAt, state:backup.state, files:backup.files||{} });
  }
}
function restoreChoiceSheet(b){
  const n = (b.state.documents||[]).length, nf = Object.keys(b.files||{}).filter(k=>!k.endsWith(':t')).length;
  const has = state.documents.length;
  openSheet({ restore:true, b,
    render:()=>`<h3>Restore backup</h3>
      <p class="sub">${b.kind==='plain'?'Plain':'Encrypted'} backup from ${esc(fmtDate(toISO(new Date(b.createdAt))))}: ${n} document${n===1?'':'s'}, ${(b.state.profiles||[]).filter(p=>!p.deleted).length} profile(s), ${nf} file(s).</p>
      ${has ? `<button class="opt" data-act="restoreApply" data-m="add"><i class="ti ti-plus" aria-hidden="true"></i><div><div class="opt-t">Add to this phone</div><div class="opt-s">Keeps your ${has} document${has===1?'':'s'}; where both have the same document, the newer one wins</div></div></button>` : ''}
      <button class="opt${has?' danger':''}" data-act="restoreApply" data-m="replace"><i class="ti ti-${has?'replace':'download'}" aria-hidden="true"></i><div><div class="opt-t">${has?'Replace everything on this phone':'Restore'}</div><div class="opt-s">${has?'Your current documents and files here are deleted first':'Brings back all documents and files'}</div></div></button>
      <button class="opt" data-act="back"><i class="ti ti-x" aria-hidden="true"></i><div><div class="opt-t">Cancel</div></div></button>` });
}
async function applyBackup(b, mode){
  const docs = clone(b.state.documents || []);
  const sameVault = b.kind==='encrypted' && b.vaultPub === lockRec.skPub;
  // 1. sealed values → this phone's vault; plain values get sealed below by sealPlainSensitive()
  if(b.kind==='encrypted' && !sameVault){
    const reseal = async h=>{ for(const k of Object.keys(h.sealed||{})) h.sealed[k] = await sealText(await openSealed(b.vaultPriv, h.sealed[k])); };
    for(const d of docs){ await reseal(d); for(const h of (d.history||[])) await reseal(h); }
  }
  // 2. files
  const keepRemote = !!(syncCfg && b.gistId && b.gistId===syncCfg.gistId);
  let restoredFiles = 0;
  for(const a of allAtts(docs)){
    if(!keepRemote) delete a.remote;
    for(const id of [a.id].concat(a.hasThumb ? [a.id+':t'] : [])){
      const f = (b.files||{})[id]; if(!f) continue;
      if(b.kind==='plain'){ await writeFile(id, unb64(f.b64), id===a.id && a.sensitive); }
      else if(f.m==='vault'){
        const rec = { ek:unb64(f.ek).buffer, iv:unb64(f.iv), ct:unb64(f.ct).buffer };
        if(sameVault) await idbPut(Object.assign({ id, mode:'vault' }, rec));
        else { const s = await sealBytes(await openSealedBytes(b.vaultPriv, rec)); await idbPut({ id, mode:'vault', ek:s.ek, iv:s.iv, ct:s.ct }); }
      } else {
        const bytes = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:unb64(f.iv) }, b.key, unb64(f.ct)));
        await writeFile(id, bytes, false);
      }
      if(id===a.id) restoredFiles++;
    }
  }
  if(_locked) return;
  // 3. merge into the state
  const oldAtts = allAtts(state.documents);
  const keepCal = new Map(state.documents.map(d=>[d.id, d.cal]));
  if(mode==='replace'){
    state.documents = docs;
    state.profiles = clone(b.state.profiles || []);
    state.types = clone(b.state.types && b.state.types.length ? b.state.types : state.types);
    const local = {}; LOCAL_SETTINGS.concat(['lastBackupAt','lastBackupKind']).forEach(k=>{ if(state.settings[k]!==undefined) local[k] = state.settings[k]; });
    state.settings = Object.assign(clone(b.state.settings || {}), local);
  } else {
    for(const p of (b.state.profiles||[])) if(!state.profiles.some(x=>x.id===p.id)) state.profiles.push(clone(p));
    for(const t of (b.state.types||[])) if(!state.types.some(x=>x.id===t.id)) state.types.push(clone(t));
    for(const d of docs){
      const i = state.documents.findIndex(x=>x.id===d.id);
      if(i<0) state.documents.push(d);
      else if((d.updatedAt||'') > (state.documents[i].updatedAt||'')) state.documents[i] = d;
    }
  }
  const merged = { profiles:state.profiles, documents:state.documents };
  dedupeSelf(merged, mode==='replace' ? b.state : { profiles: state.profiles.filter(p=>!(b.state.profiles||[]).some(x=>x.id===p.id)) });
  state.profiles = merged.profiles;
  state.documents.forEach(d=>{ const c = keepCal.get(d.id); if(c) d.cal = c; else delete d.cal; });
  normalizeLoadedState();
  await sealPlainSensitive();
  await lockTypeImages().catch(()=>0);
  const keep = new Set(allAtts(state.documents).map(a=>a.id));
  await deleteAttachmentFiles(oldAtts.filter(a=>!keep.has(a.id)));
  if(ui.profile!=='all' && !profileById(ui.profile)) ui.profile = 'all';
  applyTheme(); save();
  while(nav.length) nav.pop(); lastSheetEntry = null;
  renderNav(true);
  toast(`Restored ${docs.length} document${docs.length===1?'':'s'} and ${restoredFiles} file${restoredFiles===1?'':'s'}.`);
  if(calNeedsUpdate().length) setTimeout(()=>{ if(!_locked && !nav.length) openCalendarSheet(calNeedsUpdate(), { all:true, title:'Add the restored reminders to your calendar' }); }, 400);
}

/* ----- settings card + nudge ----- */
function backupCardHTML(){
  const last = state.settings.lastBackupAt;
  const ago = last ? Math.floor((Date.now() - Date.parse(last))/86400000) : null;
  const folder = typeof window.showDirectoryPicker==='function';
  return `<div class="card" style="padding:10px 14px">
    <div class="kv" style="border:none;padding:0"><span class="row-title">Backup and restore</span><span class="on-badge${last?' on':''}">${last ? (ago===0?'Today':ago+' day'+(ago===1?'':'s')+' ago') : 'Never'}</span></div>
    <p class="sub">${last ? `Last backup ${esc(fmtDate(toISO(new Date(last))))} (${state.settings.lastBackupKind==='plain'?'plain':'encrypted'}).` : 'You haven’t made a backup on this device yet.'} ${syncCfg ? 'GitHub sync also keeps an encrypted copy.' : ''}</p>
    <div class="sec-actions" style="flex-direction:column">
      <button class="btn primary" data-act="backupMake" data-k="encrypted"><i class="ti ti-shield-lock" aria-hidden="true"></i>Encrypted backup</button>
      <button class="btn" data-act="backupPlain"><i class="ti ti-file-text" aria-hidden="true"></i>Plain backup (readable, not encrypted)…</button>
      <button class="btn" data-act="restorePick"><i class="ti ti-restore" aria-hidden="true"></i>Restore from backup</button>
    </div>
    ${folder ? `<p class="muted">${_backupDirName ? `Backups save to the folder “${esc(_backupDirName)}”. <button class="mini-btn" data-act="backupFolderChange">Change</button> <button class="mini-btn" data-act="backupFolderForget">Forget</button>` : 'On this computer you can choose a folder once and backups save there.'}</p>` : `<p class="muted">On the phone, backups go to Downloads or anywhere the share sheet offers (My Files, Google Drive).</p>`}
  </div>`;
}
function backupNudgeHTML(){
  if(syncCfg || !state.documents.length) return '';
  const last = state.settings.lastBackupAt ? Date.parse(state.settings.lastBackupAt) : 0;
  const oldest = Math.min(...state.documents.map(d=>Date.parse(d.createdAt||'') || Date.now()));
  if(Date.now() - oldest < 7*86400000) return '';            // give a new user a week
  if(last && Date.now() - last < 30*86400000) return '';
  return `<button class="sum-item cal" data-act="openSettings"><i class="ti ti-database-export" aria-hidden="true"></i><span>${last ? 'No backup for over a month' : 'You don’t have a backup yet'}. If this phone is lost, so are your documents. <u>Back up</u></span></button>`;
}

/* ---------- boot ---------- */
function boot(){
  applyTheme();
  $('lock-screen').classList.add('hidden');
  if(_locked){ showLockScreen(); return; }
  if(!HAS_SUBTLE){
    $('app').classList.add('hidden'); $('welcome').classList.remove('hidden');
    $('welcome').innerHTML = `<h1>Open Expiry securely</h1><p class="sub">Expiry encrypts everything, which needs its secure (https) web address. Open it from there instead of as a file.</p>`;
    return;
  }
  if(!lockRec || setupStep==='bio'){
    if(!setupStep) setupStep = activeProfiles().length ? 'password' : 'name';
    $('app').classList.add('hidden'); $('welcome').classList.remove('hidden');
    renderSetup(); renderSheet(); return;
  }
  $('welcome').classList.add('hidden'); $('app').classList.remove('hidden');
  lastSideEntry = undefined;
  renderNav(true);
  openPendingDocLink();
}
function startApp(){
  if(_locked){ boot(); return; }
  normalizeLoadedState();
  boot();
}
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
registerServiceWorker();
startApp();
</script>
