<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expiry</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12161F">
<script>try{ if(localStorage.getItem('expiry_lock_v1')) document.documentElement.classList.add('is-locked'); }catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E8; --surface:#FFFFFF; --surface-2:#FBF8F1;
    --border:#DAD5C8; --border-strong:#C7C0AC;
    --text:#2B2B28; --text-2:#6B6858; --text-3:#9C9887;
    --accent:#7A2E2E; --accent-bg:#F3E6E3; --on-accent:#FFFFFF;
    --red:#A33333; --red-bg:#F7E6E6;
    --amber:#8A5A0B; --amber-bg:#F8EBD3;
    --green:#3B6D2E; --green-bg:#E4EFDC;
    --blue:#33587A; --blue-bg:#E3ECF2;
    --grey:#6B6858; --grey-bg:#ECE8DE;
    --radius:12px;
  }
  html[data-theme="midnight"]{
    --bg:#12161F; --surface:#1B212D; --surface-2:#212838;
    --border:#2A3140; --border-strong:#3A4356;
    --text:#E9E4D8; --text-2:#A8A290; --text-3:#6E7280;
    --accent:#C9A227; --accent-bg:#332B18; --on-accent:#12161F;
    --red:#E08A7C; --red-bg:#3A2420;
    --amber:#E0B054; --amber-bg:#3A2E18;
    --green:#7CC495; --green-bg:#1A3024;
    --blue:#7FA3D6; --blue-bg:#1B2740;
    --grey:#A8A290; --grey-bg:#262C38;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.45;}
  button,input,select,textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  .ti{font-size:20px; line-height:1; vertical-align:-3px;}
  .hidden{display:none !important;}

  /* ---------- panes (phone: one at a time) ---------- */
  #list-pane{max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 8px) 16px 24px; min-height:100vh;}
  #side-pane{display:none;}
  body.pane-open #list-pane{display:none;}
  body.pane-open #side-pane{display:block; max-width:640px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 8px) 16px 40px; min-height:100vh;}

  /* ---------- header ---------- */
  .topbar{display:flex; align-items:center; gap:4px; min-height:48px;}
  .topbar h1{font-size:22px; font-weight:600; margin:0; flex:1;}
  .topbar h2{font-size:18px; font-weight:600; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icon-btn{background:none; border:none; width:40px; height:40px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; color:var(--text-2); flex:none;}
  .icon-btn:active{background:var(--surface-2);}
  .search{width:100%; margin:4px 0 8px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); outline:none;}
  .search:focus{border-color:var(--accent);}

  /* ---------- chips, counters ---------- */
  .chips{display:flex; gap:6px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); font-size:13px; white-space:nowrap;}
  .chip.on{background:var(--accent-bg); border-color:var(--accent); color:var(--accent);}
  .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .counters{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr)); gap:8px; margin:4px 0 8px;}
  .counter{border:1px solid transparent; border-radius:10px; padding:8px 4px; text-align:center;}
  .counter b{display:block; font-size:20px; font-weight:600;}
  .counter span{font-size:12px;}
  .counter.on{border-color:currentColor;}
  .banner{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:10px 12px; border-radius:10px; background:var(--amber-bg); color:var(--amber); margin:4px 0 8px;}

  /* ---------- status colours ---------- */
  .st-expired{background:var(--red-bg); color:var(--red);}
  .st-soon{background:var(--amber-bg); color:var(--amber);}
  .st-valid{background:var(--green-bg); color:var(--green);}
  .st-renewing{background:var(--blue-bg); color:var(--blue);}
  .st-archived{background:var(--grey-bg); color:var(--grey);}
  .badge{font-size:12px; padding:2px 8px; border-radius:6px; white-space:nowrap; flex:none; font-weight:500;}

  /* ---------- list ---------- */
  .sec-title{font-size:12px; color:var(--text-3); margin:14px 0 4px; text-transform:none; letter-spacing:.02em;}
  .row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:6px;}
  .row.sel{border-color:var(--accent);}
  .row > .ti{color:var(--text-2); font-size:22px;}
  .row-main{flex:1; min-width:0;}
  .row-title{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row-sub{font-size:13px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px;}
  .link-btn{background:none; border:none; color:var(--text-2); font-size:13px; padding:10px 0; text-decoration:underline;}
  .empty{text-align:center; color:var(--text-2); padding:40px 16px;}
  .empty .ti{font-size:32px; color:var(--text-3);}
  .empty h3{color:var(--text); font-weight:600; margin:8px 0 4px;}
  .fab-wrap{position:sticky; bottom:calc(env(safe-area-inset-bottom) + 16px); display:flex; justify-content:flex-end; pointer-events:none; margin-top:16px;}
  .fab{pointer-events:auto; display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:var(--on-accent); border:none; border-radius:16px; padding:14px 20px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.25);}

  /* ---------- cards, fields ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:4px 14px; margin:10px 0;}
  .kv{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-2); font-size:13px; flex:none;}
  .kv .v{text-align:right; font-weight:500; word-break:break-word; display:flex; align-items:center; gap:6px; justify-content:flex-end;}
  .note{white-space:pre-wrap; padding:10px 0; color:var(--text);}
  .muted{color:var(--text-3); font-size:13px;}
  .sub{color:var(--text-2); font-size:13px; margin:0 0 4px;}
  .detail-head{display:flex; align-items:center; gap:10px; margin:4px 0 2px;}
  .detail-head .ti{font-size:26px; color:var(--accent);}
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; padding:10px 0;}
  .tile{position:relative; height:84px; border-radius:10px; border:1px dashed var(--border-strong); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-2); font-size:12px; overflow:hidden; padding:0;}
  .tile.has-img{border-style:solid;}
  .tile img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top;}
  .tile .tile-label{position:absolute; left:0; right:0; bottom:0; padding:3px 6px; background:rgba(0,0,0,.55); color:#fff; font-size:11px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile.has-img > .ti{font-size:26px;}
  .tile.add{color:var(--accent); border-color:var(--accent);}
  /* sync */
  .opt.picked{border-color:var(--accent); background:var(--accent-bg);}
  code{font-family:ui-monospace,Menlo,monospace; font-size:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:4px; padding:0 4px;}
  /* renew + history */
  .before{font-size:13px; color:var(--text-2); margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .before b{color:var(--text); font-weight:500;}
  .renew-card{border-color:var(--blue);}
  .renew-card .row-title .ti{color:var(--blue);}
  .hist-row{width:100%; background:none; border:none; border-bottom:1px solid var(--border); text-align:left; padding:10px 0; color:var(--text); cursor:pointer;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row > span{display:flex; flex-direction:column; min-width:0;}
  #doc-list .row{touch-action:pan-y; transition:transform .15s ease;}
  #doc-list .row.swipe-ready{border-color:var(--blue); box-shadow:inset -6px 0 0 var(--blue);}
  /* calendar + summary */
  .cal-line{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2); padding:8px 2px 0;}
  .cal-line span{flex:1;}
  .cal-line.ok{color:var(--green);}
  .cal-line.warn{color:var(--amber);}
  .summary{background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--radius); padding:8px 12px 10px; margin:4px 0 10px;}
  .summary-head{display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:14px;}
  .summary-head .icon-btn{width:32px; height:32px;}
  .sum-item{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; padding:5px 0; font-size:13px; color:var(--text);}
  .sum-item .dot{width:8px; height:8px;}
  .sum-item.cal{color:var(--amber);}
  .sum-item.cal .ti{font-size:16px;}
  /* scanning: status, sources, date alternatives, image beside fields */
  .scan-status{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:10px 12px; border-radius:10px; background:var(--blue-bg); color:var(--blue); margin:8px 0;}
  .scan-status.ok{background:var(--green-bg); color:var(--green);}
  .scan-status.bad{background:var(--red-bg); color:var(--red);}
  .src{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:600; padding:1px 6px; border-radius:6px; margin-left:4px; vertical-align:1px;}
  .src .ti{font-size:13px;}
  .src.ok{background:var(--green-bg); color:var(--green);}
  .src.chk{background:var(--amber-bg); color:var(--amber);}
  .alt-note{font-size:13px; color:var(--amber); margin-top:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .split-left{display:none;}
  .scan-preview{position:relative; border-radius:10px; overflow:hidden; background:#000; margin:6px 0;}
  .scan-preview img{display:block; width:100%; height:auto;}
  .scan-preview .hl{position:absolute; border:3px solid var(--accent); border-radius:6px; background:color-mix(in srgb, var(--accent) 18%, transparent); transition:all .2s;}
  /* live scanner (full screen in #sheet) */
  .scan-wrap{flex:1; min-height:0; display:flex; flex-direction:column;}
  .scan-cam{position:relative; flex:1; min-height:0; background:#000; overflow:hidden;}
  .scan-cam video{width:100%; height:100%; object-fit:contain; display:block;}
  .scan-guide{position:absolute; border:3px solid var(--accent); border-radius:14px; box-shadow:0 0 0 9999px rgba(0,0,0,.45); pointer-events:none;}
  .scan-msg{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; color:#ddd; background:rgba(0,0,0,.75);}
  .scan-panel{background:#111; padding:12px 16px calc(env(safe-area-inset-bottom) + 10px); color:#eee; text-align:center;}
  .scan-hint{font-size:14px; margin-bottom:8px;}
  .scan-strip{display:flex; gap:8px; justify-content:center; margin-bottom:8px; flex-wrap:wrap;}
  .scan-thumb{position:relative; width:76px; height:50px; border-radius:6px; overflow:hidden; border:1px solid #444;}
  .scan-thumb img{width:100%; height:100%; object-fit:cover;}
  .scan-thumb span{position:absolute; left:0; right:0; bottom:0; font-size:10px; background:rgba(0,0,0,.6); color:#fff;}
  .scan-actions{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:480px; margin:0 auto;}
  .scan-actions .btn{flex:0 0 auto; min-width:100px;}
  .shutter{width:74px; height:74px; border-radius:50%; border:4px solid #fff; background:transparent; display:flex; align-items:center; justify-content:center; padding:0; flex:none;}
  .shutter span{width:58px; height:58px; border-radius:50%; background:#fff; display:block;}
  .shutter:active span{background:var(--accent);}
  /* Tabletop (Fold half-open, hinge horizontal): camera on the top half, controls on the bottom half */
  @media (vertical-viewport-segments: 2){
    .scan-cam{flex:0 0 env(viewport-segment-height 0 0, 50%);}
    .scan-panel{flex:1; display:flex; flex-direction:column; justify-content:center; padding-top:calc(env(viewport-segment-top 0 1, 0px) - env(viewport-segment-bottom 0 0, 0px) + 12px);}
  }
  @media (device-posture: folded){
    .scan-cam{flex:0 0 50%;}
    .scan-panel{flex:1; display:flex; flex-direction:column; justify-content:center;}
  }
  /* full-screen viewer (rendered in #sheet) */
  #sheet.viewer-mode{inset:0; top:0; left:0; right:0; bottom:0; max-height:none; height:100%; border-radius:0; background:#000; color:#fff; padding:0; display:flex; flex-direction:column; transform:none; width:auto; z-index:45;}
  .viewer-bar{display:flex; align-items:center; gap:6px; padding:calc(env(safe-area-inset-top) + 6px) 8px 6px; background:rgba(0,0,0,.8);}
  .viewer-bar .icon-btn{color:#fff;}
  .viewer-title{flex:1; min-width:0; font-weight:500;}
  .viewer-sub{font-size:12px; color:#aaa;}
  .viewer-body{flex:1; overflow:auto; touch-action:pan-x pan-y pinch-zoom; display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px;}
  .viewer-img{max-width:100%; max-height:100%; object-fit:contain; margin:auto; cursor:zoom-in;}
  .viewer-img.zoomed{max-width:none; max-height:none; width:250%; cursor:zoom-out; margin:0;}
  .pdf-page{background:#fff; max-width:1400px; box-shadow:0 2px 10px rgba(0,0,0,.5);}
  .viewer-nav{display:flex; justify-content:space-between; padding:6px 12px calc(env(safe-area-inset-bottom) + 8px); background:rgba(0,0,0,.8);}
  .viewer-nav .icon-btn{color:#fff;}
  .actions{display:flex; gap:8px; margin:14px 0;}
  .btn{flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 14px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface); font-weight:500;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .btn.danger{color:var(--red); border-color:var(--red);}
  .mini-btn{background:none; border:1px solid var(--border-strong); border-radius:8px; padding:3px 8px; font-size:12px; color:var(--text-2); display:inline-flex; align-items:center; gap:4px;}
  .tag{font-size:11px; padding:1px 6px; border-radius:6px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border);}

  /* ---------- forms ---------- */
  .field{margin:12px 0;}
  .field label,.field .label{display:block; font-size:13px; color:var(--text-2); margin-bottom:4px;}
  .field input,.field textarea,.field select{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); outline:none;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
  .field textarea{min-height:90px; resize:vertical;}
  .field .err{color:var(--red); font-size:13px; margin-top:4px;}
  .field.invalid input,.field.invalid select{border-color:var(--red);}
  .rem-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .rem-row input{width:80px; flex:none;}
  .rem-row select{flex:1;}
  .rem-row span{color:var(--text-2); font-size:13px; flex:none;}
  .type-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px;}
  .type-opt{display:flex; align-items:center; gap:8px; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); text-align:left; font-size:14px;}
  .type-opt.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent);}
  .icon-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:6px;}
  .icon-opt{height:44px; border-radius:10px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--text-2);}
  .icon-opt.on{border-color:var(--accent); background:var(--accent-bg); color:var(--accent);}
  .icon-btn[disabled]{opacity:.3; pointer-events:none;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:34px; height:34px; border-radius:50%; border:3px solid transparent;}
  .swatch.on{border-color:var(--text);}

  /* ---------- avatars / profile colours ---------- */
  .avatar{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex:none;}
  .pc-violet{--pc:#A78BC9;} .pc-teal{--pc:#5FA89A;} .pc-orange{--pc:#E0925A;}
  .pc-pink{--pc:#D97BA0;} .pc-blue{--pc:#6C93C7;} .pc-olive{--pc:#9AA65A;}
  .avatar{background:color-mix(in srgb, var(--pc) 22%, transparent); color:var(--pc);}
  .dot{background:var(--pc, var(--text-3));}
  .swatch{background:var(--pc);}

  /* ---------- sheet (phone: bottom sheet) ---------- */
  #backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;}
  #sheet{position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--surface); border-radius:18px 18px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:85vh; overflow-y:auto;}
  #sheet h3{margin:0 0 4px; font-size:18px; font-weight:600;}
  .opt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); margin-top:8px;}
  .opt .ti{color:var(--accent); font-size:22px;}
  .opt.danger .ti,.opt.danger .opt-t{color:var(--red);}
  .opt-t{font-weight:500;}
  .opt-s{font-size:13px; color:var(--text-2);}

  /* ---------- toast + reveal bar ---------- */
  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 90px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; z-index:60; max-width:calc(100% - 32px); box-shadow:0 4px 14px rgba(0,0,0,.3);}
  #reveal-bar{position:fixed; top:calc(env(safe-area-inset-top) + 8px); left:50%; transform:translateX(-50%); z-index:50; background:var(--blue-bg); color:var(--blue); border:1px solid var(--blue); border-radius:999px; padding:6px 8px 6px 14px; font-size:13px; display:flex; align-items:center; gap:10px; white-space:nowrap;}
  /* while revealed, push pane content down so the bar never covers the header */
  body.revealing #list-pane,body.revealing #side-pane{padding-top:calc(env(safe-area-inset-top) + 56px) !important;}
  #sheet:not(.hidden) ~ #toast{bottom:auto; top:calc(env(safe-area-inset-top) + 12px);}
  #sheet.viewer-mode ~ #reveal-bar{top:auto; bottom:calc(env(safe-area-inset-bottom) + 64px);}
  #reveal-bar button{background:var(--blue); color:var(--bg); border:none; border-radius:999px; padding:4px 10px; font-size:12px; font-weight:600;}

  /* ---------- welcome / setup / lock screen ---------- */
  #welcome,#lock-screen{max-width:420px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 60px) 20px 40px;}
  #welcome h1,#lock-screen h1{font-size:26px; margin:12px 0 4px;}
  html.is-locked #app,html.is-locked #welcome,html.is-locked #sheet,html.is-locked #toast,html.is-locked #backdrop,html.is-locked #reveal-bar{display:none !important;}
  .lock-logo{width:64px; height:64px; border-radius:16px; display:block;}
  .lock-or{text-align:center; color:var(--text-3); font-size:13px; margin:10px 0;}
  .pwd-row{display:flex; gap:6px; align-items:center;}
  .pwd-row input{flex:1;}
  .err{color:var(--red); font-size:13px; min-height:18px; margin-top:6px;}
  .info{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); margin:10px 0;}
  .sec-actions{display:flex; gap:8px; flex-wrap:wrap; padding:10px 0;}
  .sec-actions .btn{flex:1 1 auto;}
  .sec-select{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); margin:6px 0 10px;}
  .on-badge{font-size:12px; padding:2px 8px; border-radius:6px; background:var(--grey-bg); color:var(--grey);}
  .on-badge.on{background:var(--green-bg); color:var(--green);}

  /* ---------- Unfolded / wide layout (Galaxy Z Fold inner screen, tablets, laptop) ----------
     Every rule below sits inside a min-width media query, so the folded phone layout above is
     untouched. Both panes are always in the DOM; folding only changes CSS, never re-renders. */
  @media (min-width:720px){
    #app{display:grid; grid-template-columns:minmax(320px,42%) minmax(0,1fr); height:100vh; height:100dvh;}
    #list-pane,body.pane-open #list-pane{display:block; max-width:none; margin:0; height:100%; overflow-y:auto; border-right:1px solid var(--border);}
    #side-pane,body.pane-open #side-pane{display:block; max-width:none; margin:0; height:100%; overflow-y:auto; padding:calc(env(safe-area-inset-top) + 8px) 24px 40px;}
    .side-inner{max-width:720px; margin:0 auto;}
    .side-inner.wide-split{max-width:1240px;}
    body.wide-editor #app,body.wide-editor.pane-open #app{grid-template-columns:minmax(0,1fr);}
    body.wide-editor #list-pane{display:none;}
    .editor-split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start;}
    .split-left{display:block; position:sticky; top:8px;}
    .phone-only{display:none !important;}
    #sheet{left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%); width:min(480px,90vw); border-radius:18px; max-height:80vh;}
    #sheet.viewer-mode{left:0; top:0; transform:none; width:auto; max-height:none; border-radius:0;}
    #toast{left:71%;}
  }
  @media (max-width:719.98px){
    .wide-only{display:none !important;}
  }
  @media (min-width:1100px){
    #app{grid-template-columns:minmax(360px,36%) minmax(0,1fr);}
  }
</style>
</head>
<body>
<div id="lock-screen" class="hidden"></div>
<div id="welcome" class="hidden"></div>
<div id="app" class="hidden">
  <main id="list-pane"></main>
  <section id="side-pane"></section>
</div>
<div id="backdrop" class="hidden" data-act="back"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>
<input type="file" id="pick-camera" accept="image/*" capture="environment" class="hidden">
<input type="file" id="pick-photo" accept="image/*" multiple class="hidden">
<input type="file" id="pick-file" accept="image/*,application/pdf" multiple class="hidden">
<input type="file" id="pick-restore" accept=".json,.html,application/json,text/html" class="hidden">
<div id="reveal-bar" class="hidden"></div>
<div id="toast" class="hidden" role="status"></div>

<script>
'use strict';
/* =====================================================================================
   Expiry — M2 (records, profiles, Fold layouts, app lock + sensitive vault). See DESIGN.md.
   Architecture mirrors Mandoos: loadState() is synchronous, save() is the single write
   chokepoint (encrypted, async, coalesced), startApp() runs after unlock.
   Nothing is ever written to storage unencrypted.
   ===================================================================================== */
const APP_VERSION = 'M9';
const STATE_KEY = 'expiry_state';
const LOCK_REC_KEY = 'expiry_lock_v1';
const BIO_KEY = 'expiry_bio';
const AUTOLOCK_KEY = 'expiry_autolock';
const PBKDF2_ITER = window.EXPIRY_PBKDF2_ITER || 310000; // test hook lowers this; real value stored per record
const HAS_SUBTLE = !!(window.crypto && window.crypto.subtle);
const MS_DAY = 86400000;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PROFILE_COLORS = ['violet','teal','orange','pink','blue','olive'];
const RELATIONS = ['You','Spouse','Son','Daughter','Father','Mother','Brother','Sister','Other'];

/* ---------- small utils ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function $(id){ return document.getElementById(id); }

/* ---------- dates (all local, stored as YYYY-MM-DD) ---------- */
function parseISO(s){
  if(!s || typeof s!=='string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return (d.getMonth()===+m[2]-1) ? d : null;
}
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayDate(){
  const o = window.EXPIRY_TODAY && parseISO(window.EXPIRY_TODAY); // test hook
  if(o) return o;
  const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function dayNum(d){ return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/MS_DAY); }
function daysBetween(a,b){ return dayNum(b)-dayNum(a); }
function addMonthsClamped(d,n){
  const y = d.getFullYear(), m = d.getMonth()+n;
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(d.getDate(), last));
}
function shiftDate(d, amount, unit){
  if(unit==='months') return addMonthsClamped(d, amount);
  const days = unit==='weeks' ? amount*7 : amount;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()+days);
}
function monthsBetween(a,b){
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m--;
  return m;
}
const DATE_DISPLAYS = { text:'14 Apr 2027', dmy:'14/04/2027', mdy:'04/14/2027', iso:'2027-04-14' };
function fmtDateLong(iso){ const d = parseISO(iso); return d ? d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear() : ''; }
function fmtDate(iso){
  const d = parseISO(iso); if(!d) return '';
  let f = 'text'; try{ f = (state && state.settings && state.settings.dateDisplay) || 'text'; }catch(e){}
  if(f==='dmy') return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  if(f==='mdy') return pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear();
  if(f==='iso') return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  return fmtDateLong(iso);
}
function fmtMonthYear(iso){ const d = parseISO(iso); return d ? pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(-2) : ''; }
function monthInputValue(iso){ const d = parseISO(iso); return d ? d.getFullYear()+'-'+pad(d.getMonth()+1) : ''; }
function lastDayOfMonthISO(ym){
  const m = /^(\d{4})-(\d{2})$/.exec(ym||'');
  return m ? toISO(new Date(+m[1], +m[2], 0)) : '';
}
function timeLeftLabel(expiryISO, today){
  const exp = parseISO(expiryISO); if(!exp) return '';
  const d = daysBetween(today, exp);
  if(d < 0){
    const ago = -d;
    if(ago <= 60) return ago+'d ago';
    const mo = monthsBetween(exp, today);
    return mo < 24 ? mo+' mo ago' : Math.floor(mo/12)+' yrs ago';
  }
  if(d === 0) return 'Today';
  if(d === 1) return '1 day';
  if(d <= 60) return d+' days';
  const mo = monthsBetween(today, exp);
  return mo < 24 ? mo+' mo' : Math.floor(mo/12)+' yrs';
}
function leadLabel(r){
  const n = r.amount, u = r.unit;
  const word = u==='months' ? 'month' : u==='weeks' ? 'week' : 'day';
  return n+' '+word+(n===1?'':'s');
}

/* ---------- document type templates ----------
   Every type lists its fields. 'expiry' and 'note' exist on every type. Field flags:
   required · sensitive (masked until revealed) · onList (shown on the Home row).
   Stored in state so they can be edited in a later milestone (M9). */
function F(key,label,kind,extra){ return Object.assign({key,label,kind:kind||'text'}, extra||{}); }
const EXPIRY = (kind)=>F('expiry','Expiry date',kind||'date',{required:true});
const NOTE = F('note','Note','longtext');
const DEFAULT_TYPES = [
  {id:'passport', name:'Passport', icon:'world', imagesSensitive:true,
    reminders:[{amount:9,unit:'months'},{amount:6,unit:'months'}],
    fields:[F('ref','Passport no.','text',{onList:true}), F('issuer','Issuing country'), F('issueDate','Issue date','date'), EXPIRY(), F('placeOfIssue','Place of issue'), NOTE]},
  {id:'national-id', name:'National ID', icon:'id', imagesSensitive:true,
    reminders:[{amount:3,unit:'months'},{amount:1,unit:'months'}],
    fields:[F('ref','ID number','text',{onList:true}), F('issuer','Issuing country'), F('issueDate','Issue date','date'), EXPIRY(), NOTE]},
  {id:'drivers-licence', name:"Driver's licence", icon:'license', imagesSensitive:true,
    reminders:[{amount:2,unit:'months'},{amount:2,unit:'weeks'}],
    fields:[F('ref','Licence no.','text',{onList:true}), F('issuer','Issuing authority'), F('classes','Classes'), F('issueDate','Issue date','date'), EXPIRY(), NOTE]},
  {id:'bank-card', name:'Bank card', icon:'credit-card', imagesSensitive:true, titleKey:'cardName',
    reminders:[{amount:30,unit:'days'}],
    fields:[F('cardName','Card name','text',{placeholder:'Visa debit'}), F('ref','Card number','text',{onList:true, sensitive:true}), F('issuer','Bank'), EXPIRY('month'), NOTE]},
  {id:'vehicle-registration', name:'Vehicle registration', icon:'car', imagesSensitive:true,
    reminders:[{amount:30,unit:'days'},{amount:7,unit:'days'}],
    fields:[F('ref','Plate number','text',{onList:true}), F('vehicle','Vehicle','text',{placeholder:'Toyota Prado'}), F('issuer','Licensing authority'), F('vin','Chassis / VIN'), EXPIRY(), NOTE]},
  {id:'insurance', name:'Insurance', icon:'shield-check', imagesSensitive:true,
    reminders:[{amount:30,unit:'days'},{amount:7,unit:'days'}],
    fields:[F('ref','Policy no.','text',{onList:true}), F('issuer','Insurer'), F('cover','Cover','text',{placeholder:'Car, comprehensive'}), F('issueDate','Start date','date'), EXPIRY(), NOTE]},
  {id:'visa', name:'Visa / permit', icon:'plane', imagesSensitive:true,
    reminders:[{amount:3,unit:'months'},{amount:1,unit:'months'}],
    fields:[F('ref','Visa / permit no.','text',{onList:true}), F('issuer','Issuing country'), F('visaType','Type','text',{placeholder:'Work permit'}), F('issueDate','Issue date','date'), EXPIRY(), NOTE]},
  {id:'other', name:'Other', icon:'file-text', imagesSensitive:true,
    reminders:[{amount:30,unit:'days'}],
    fields:[F('ref','Reference no.','text',{onList:true}), F('issuer','Issuer'), F('issueDate','Issue date','date'), EXPIRY(), NOTE]},
];

/* ---------- state ---------- */
function emptyState(){
  return { version:1, profiles:[], types:JSON.parse(JSON.stringify(DEFAULT_TYPES)), documents:[], settings:{ theme:'midnight' }, imgLockV:1 };
}
let storageOK = true;
function loadLockRecord(){
  try{ const r = JSON.parse(localStorage.getItem(LOCK_REC_KEY)); return r && r.salt && r.hash && r.dekWrap && r.skWrap && r.skPub ? r : null; }
  catch(e){ return null; }
}
function isEncBlob(o){ return !!(o && typeof o==='object' && o.__enc===1 && typeof o.iv==='string' && typeof o.ct==='string'); }
let lockRec = loadLockRecord();
let _locked = !!lockRec;   // true from page load until a successful unlock
let _sessionKey = null;    // the data key — in memory only while unlocked
function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(lockRec) return emptyState(); // decrypted by finishUnlock()
    if(raw){
      const parsed = JSON.parse(raw);
      // Encrypted data but no lock record: the keys are gone. Stay locked, never overwrite the blob.
      if(isEncBlob(parsed)){ _locked = true; return emptyState(); }
      return parsed; // M1 plaintext data — encrypted as soon as the password is created
    }
    return emptyState();
  }catch(e){ storageOK = false; return emptyState(); }
}
let state = loadState();
// The single write chokepoint. Writes only ever happen encrypted, under the data key.
function save(){
  if(_locked || !lockRec || !_sessionKey) return;
  secureWrite(STATE_KEY, JSON.stringify(state));
  if(typeof noteLocalChange==='function') noteLocalChange();
}
// crypto.subtle is async but save() is synchronous, so writes are coalesced: the newest JSON per
// key is encrypted and stored by one background loop. lockApp() awaits flushSecureWrites() first.
const _pendingWrites = {};
let _flushP = null;
function secureWrite(key, json){
  _pendingWrites[key] = json;
  if(!_flushP) _flushP = flushSecureLoop();
  return _flushP;
}
async function flushSecureLoop(){
  try{
    let failed = false;
    while(Object.keys(_pendingWrites).length){
      for(const k of Object.keys(_pendingWrites)){
        const json = _pendingWrites[k]; delete _pendingWrites[k];
        if(!lockRec || !_sessionKey) continue;
        try{
          const blob = await encryptWith(_sessionKey, new TextEncoder().encode(json));
          localStorage.setItem(k, JSON.stringify({ __enc:1, iv:blob.iv, ct:blob.ct }));
        }catch(e){ failed = true; }
      }
    }
    if(failed){ if(storageOK) toast('Couldn’t save on this device. Changes may be lost.'); storageOK = false; }
    else if(!storageOK){ storageOK = true; toast('Storage is available again. Changes are saving.'); }
  }finally{ _flushP = null; }
}
async function flushSecureWrites(){ while(_flushP) await _flushP; }
function normalizeLoadedState(){
  const base = emptyState();
  if(!state || typeof state!=='object') state = base;
  if(!Array.isArray(state.profiles)) state.profiles = [];
  if(!Array.isArray(state.documents)) state.documents = [];
  if(!Array.isArray(state.types)) state.types = base.types;
  // add any built-in type that is missing (new built-ins in later versions)
  for(const t of base.types){ if(!state.types.some(x=>x.id===t.id)) state.types.push(t); }
  // M9.1: images of every built-in type are locked by default (earlier builds left three unlocked)
  if(!state.imgLockV){ for(const t of state.types) if(isBuiltinType(t.id)) t.imagesSensitive = true; state.imgLockV = 1; }
  if(!state.settings) state.settings = {};
  if(!state.settings.theme) state.settings.theme = 'midnight';
  if(state.settings.revealMode!=='each') state.settings.revealMode = 'window';
  if(state.settings.dateFormat!=='MDY') state.settings.dateFormat = 'DMY';
  if(!DATE_DISPLAYS[state.settings.dateDisplay]) state.settings.dateDisplay = 'text';
  if(!/^\d{2}:\d{2}$/.test(state.settings.reminderTime||'')) state.settings.reminderTime = '09:00';
  if(state.settings.summaryOnOpen!==false) state.settings.summaryOnOpen = true;
  if(!Array.isArray(state.calTombstones)) state.calTombstones = [];
  for(const d of state.documents){
    if(!d.values) d.values = {};
    if(!d.sealed) d.sealed = {};  // sensitive values, sealed to the vault's public key
    if(!d.masks) d.masks = {};    // last 4 characters, for the masked display
    if(!Array.isArray(d.attachments)) d.attachments = [];
    if(!Array.isArray(d.reminders)) d.reminders = [];
    if(!Array.isArray(d.history)) d.history = [];
    if(!d.state) d.state = 'active';
  }
}

/* ---------- lookups ---------- */
function typeById(id){ return state.types.find(t=>t.id===id) || state.types.find(t=>t.id==='other'); }
function profileById(id){ return state.profiles.find(p=>p.id===id); }
function activeProfiles(){ return state.profiles.filter(p=>!p.deleted); }
function docById(id){ return state.documents.find(d=>d.id===id); }
function initials(name){
  const parts = String(name||'?').trim().split(/\s+/);
  return ((parts[0]||'?')[0] + (parts.length>1 ? parts[parts.length-1][0] : (parts[0][1]||''))).toUpperCase();
}
const TITLE_MAX = 25;
function ownTitle(doc){ const v = doc && doc.values && doc.values.title; return v ? String(v).trim().slice(0, TITLE_MAX) : ''; }
function docTitle(doc){
  const own = ownTitle(doc); if(own) return own;
  const t = typeById(doc.typeId);
  const v = t.titleKey && doc.values[t.titleKey];
  return (v && String(v).trim()) || t.name;
}
// list order: soonest expiry (none last), then type name A–Z, then title A–Z
function compareDocs(a, b){
  const ea = a.values.expiry || '9999-12-31', eb = b.values.expiry || '9999-12-31';
  if(ea !== eb) return ea < eb ? -1 : 1;
  const byType = typeById(a.typeId).name.localeCompare(typeById(b.typeId).name, undefined, {sensitivity:'base'});
  if(byType) return byType;
  return docTitle(a).localeCompare(docTitle(b), undefined, {sensitivity:'base', numeric:true});
}
// for use inside a sentence: a title you typed keeps its capitals, a type name is lowercased
function docTitleInline(doc){ return ownTitle(doc) || docTitle(doc).toLowerCase(); }
function maskValue(v){ const s = String(v||'').replace(/\s+/g,''); return s.length>4 ? '•••• '+s.slice(-4) : '••••'; }
function last4(v){ const s = String(v||'').replace(/\s+/g,''); return s.length>4 ? s.slice(-4) : ''; }
function maskedFor(doc, key){ const m = doc.masks && doc.masks[key]; return m ? '•••• '+m : '••••'; }
function hasValue(doc, f){ return f.sensitive ? !!((doc.sealed && doc.sealed[f.key]) || doc.values[f.key]) : !(doc.values[f.key]==null || doc.values[f.key]===''); }
function fieldDisplay(field, value){
  if(field.kind==='date') return fmtDate(value);
  if(field.kind==='month') return fmtMonthYear(value);
  return String(value);
}
function listValue(doc){
  const t = typeById(doc.typeId);
  const f = t.fields.find(x=>x.onList);
  if(!f || !hasValue(doc, f)) return '';
  return f.sensitive ? maskedFor(doc, f.key) : fieldDisplay(f, doc.values[f.key]);
}

/* ---------- status + reminders ---------- */
function reminderDates(doc){
  const exp = parseISO(doc.values.expiry); if(!exp) return [];
  return (doc.reminders||[]).map(r=>({ id:r.id, lead:leadLabel(r), date:toISO(shiftDate(exp, -r.amount, r.unit)) }))
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function docStatus(doc, today){
  today = today || todayDate();
  if(doc.state==='archived') return 'archived';
  if(doc.state==='renewing') return 'renewing';
  const exp = parseISO(doc.values.expiry);
  if(!exp) return 'valid';
  if(daysBetween(today, exp) < 0) return 'expired';
  const rs = reminderDates(doc);
  const windowStart = rs.length ? parseISO(rs[0].date) : shiftDate(exp, -30, 'days');
  return daysBetween(windowStart, today) >= 0 ? 'soon' : 'valid';
}
const STATUS_LABEL = { expired:'Expired', soon:'Expiring soon', valid:'Valid', renewing:'Renewing', archived:'Archived' };
function badgeText(doc, today){
  const st = docStatus(doc, today);
  if(st==='archived') return 'Archived';
  if(st==='renewing') return 'Renewing';
  return timeLeftLabel(doc.values.expiry, today);
}
function profileStats(pid){
  const today = todayDate();
  const s = { total:0, expired:0, soon:0, valid:0, renewing:0, archived:0 };
  for(const d of state.documents){ if(d.ownerId!==pid) continue; const st = docStatus(d, today); s[st]++; if(st!=='archived') s.total++; }
  return s;
}

/* ---------- UI state ---------- */
const ui = { profile:'all', status:null, search:'', searchOpen:false, showArchived:false };
let draft = null;   // document being added/edited
let pdraft = null;  // profile being added/edited
// a pane with unsaved changes: leaving it asks first
function paneDirty(top){ return !!(top && top.kind==='pane' && ((top.screen==='edit' && draft && draft.dirty) || (top.screen==='profile-edit' && pdraft && pdraft.dirty) || (top.screen==='type-edit' && tdraft && tdraft.dirty))); }

/* ---------- navigation ----------
   nav is a stack of {kind:'pane'|'sheet', screen, ...}. While it isn't empty, one extra browser
   history entry is kept ("trap") so Android's back gesture closes the top item instead of
   leaving the app. Programmatic closes never call history.back() mid-flow, which avoids races. */
const nav = [];
let trapArmed = false, skipPop = 0, listScrollY = 0;
function armTrap(){ if(!trapArmed){ try{ history.pushState({expiry:1}, ''); }catch(e){} trapArmed = true; } }
function scheduleDisarm(){
  setTimeout(()=>{
    if(!nav.length && trapArmed){ skipPop++; trapArmed = false; try{ history.back(); }catch(e){ skipPop--; } }
  }, 0);
}
function topEntry(){ return nav[nav.length-1]; }
function topPane(){ for(let i=nav.length-1;i>=0;i--) if(nav[i].kind==='pane') return nav[i]; return null; }
function push(entry){
  if(!nav.some(e=>e.kind==='pane') && entry.kind==='pane') listScrollY = window.scrollY||0;
  nav.push(entry); armTrap(); renderNav();
}
function replaceTop(entry){ if(!nav.length) return push(entry); nav[nav.length-1] = entry; renderNav(); }
function pop(){
  if(!nav.length) return;
  const wasPane = topEntry().kind==='pane';
  const popped = nav.pop();
  if(popped.onClose) popped.onClose();
  renderNav();
  if(wasPane && !nav.some(e=>e.kind==='pane')) restoreListScroll();
  if(!nav.length) scheduleDisarm();
}
function restoreListScroll(){ const y = listScrollY; setTimeout(()=>{ try{ window.scrollTo(0, y); }catch(e){} }, 0); }
function closeAllPanes(){ while(nav.length) nav.pop(); renderNav(); restoreListScroll(); scheduleDisarm(); }
function goBack(){
  const top = topEntry();
  if(paneDirty(top)){ askDiscard(()=>pop()); return; }
  pop();
}
window.addEventListener('popstate', ()=>{
  if(skipPop){ skipPop--; if(nav.length) armTrap(); return; }
  trapArmed = false;
  if(!nav.length) return;
  const top = topEntry();
  const dirty = paneDirty(top);
  armTrap();
  if(dirty){ askDiscard(()=>pop()); return; }
  pop();
});

let lastSideEntry = undefined;
function renderNav(force){
  const pane = topPane();
  // "ask every time": leaving the revealed document (other than to edit it) hides it again
  if(revealScope){
    const cur = pane && (pane.screen==='detail' ? pane.id : (pane.screen==='edit' && draft ? draft.id : null));
    if(cur!==revealScope) hideReveal();
  }
  document.body.classList.toggle('pane-open', !!pane);
  if(force || pane!==lastSideEntry){ renderSide(pane); lastSideEntry = pane; }
  // Check details for a scan takes the whole inner screen when unfolded: image left, fields right
  document.body.classList.toggle('wide-editor', !!(pane && pane.screen==='edit' && wideEditorOn()));
  renderSheet();
  renderHome();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const el = $('toast'); if(!el) return;
  el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.add('hidden'), 3200);
}

/* ---------- sensitive reveal ----------
   Sensitive values are sealed to the vault's public key. Reading them needs the vault's private
   key, which only a fresh fingerprint or password releases (openRevealPrompt). It is then held for
   a 60-second window (or, in "ask every time" mode, only while that one document is open) and
   dropped together with every decrypted value. */
let revealUntil = 0, revealScope = null, revealTick = null, _skPriv = null;
const _plain = {}; // docId -> { fieldKey: decrypted value }
function isRevealedFor(id){ return !!_skPriv && Date.now() < revealUntil && (revealScope===null || revealScope===id); }
function anyRevealed(){ return !!_skPriv && Date.now() < revealUntil; }
async function grantReveal(priv, docId){
  _skPriv = priv;
  revealUntil = Date.now() + 60*1000;
  revealScope = state.settings.revealMode==='each' ? docId : null;
  clearInterval(revealTick); revealTick = setInterval(updateRevealBar, 1000);
  if(docId) await decryptDoc(docId);
  updateRevealBar(); rerenderRevealables();
}
async function decryptDoc(id){
  const d = docById(id); if(!d || !_skPriv) return;
  const priv = _skPriv, out = {};
  for(const k of Object.keys(d.sealed||{})){
    try{ out[k] = await openSealed(priv, d.sealed[k]); }catch(e){ out[k] = null; }
  }
  if(_skPriv===priv) _plain[id] = out; // not if it was hidden meanwhile
}
function hideReveal(){
  const was = !!_skPriv || revealUntil > 0;
  _skPriv = null; revealUntil = 0; revealScope = null;
  for(const k of Object.keys(_plain)) delete _plain[k];
  dropUrls(true);
  const v = topEntry();
  if(v && v.viewer){ const a = attsFor(v.docId, v.hid)[v.index]; if(a && a.sensitive) pop(); }
  clearInterval(revealTick); revealTick = null;
  const bar = $('reveal-bar'); if(bar){ bar.classList.add('hidden'); bar.innerHTML = ''; }

}
function updateRevealBar(){
  const left = Math.ceil((revealUntil - Date.now())/1000);

  const bar = $('reveal-bar');
  bar.innerHTML = `<i class="ti ti-eye" aria-hidden="true"></i><span>Revealed · hides in ${Math.floor(left/60)}:${pad(left%60)}</span><button data-act="hideReveal">Hide now</button>`;

function draftFromDoc(d){

function fieldInput(f){

  else input = `<input type="text" ${common} value="${esc(v)}" placeholder="${esc(keepHint||f.placeholder||'')}" autocomplete="off"${f.sensitive?' autocapitalize="off" spellcheck="false"':''}>`;
  const flags = (f.required?' <span class="tag">required</span>':'') + (f.sensitive?' <span class="tag">sensitive</span>':'') + srcBadge(f.key);
  return `<div class="field${err?' invalid':''}"><label for="f-${esc(f.key)}">${esc(f.label)}${flags}</label>${input}${altNote(f.key)}${beforeHTML(f)}${err?`<div class="err" id="err-${esc(f.key)}">${esc(err)}</div>`:''}</div>`;

function wideEditorOn(){ return !!(draft && (!draft.id || draft.mode==='renew') && draft.pending && draft.pending.length); }
function rerenderEditor(){ const p = topPane(); if(p && p.screen==='edit'){ renderSide(p); document.body.classList.toggle('wide-editor', wideEditorOn()); } }
function validateDraft(){
  const t = typeById(draft.typeId);
  const errors = {};
  if(!profileById(draft.ownerId) || profileById(draft.ownerId).deleted) errors.owner = 'Choose who this document belongs to.';
  for(const f of t.fields){
    const v = String(draft.values[f.key]||'').trim();
    const kept = f.sensitive && draft.sealedMasks && draft.sealedMasks[f.key];
    if(f.required && !v && !kept) errors[f.key] = 'Enter the '+f.label.toLowerCase()+'.';
    else if(v && (f.kind==='date'||f.kind==='month') && !parseISO(v)) errors[f.key] = 'Enter a valid date.';
  }
  if(draft.reminders.some(r=>!(Number.isInteger(r.amount) && r.amount>=1 && r.amount<=600))) errors.reminders = 'Each reminder needs a whole number, 1 or more.';
  return errors;
}
let _saving = false;

    const firstKey = Object.keys(draft.errors)[0];
    const el = $('f-'+firstKey); if(el) el.focus();
    return;
  }
  const t = typeById(draft.typeId);
  const existing = draft.id ? docById(draft.id) : null;
  const values = {}, sealed = {}, masks = {};
  _saving = true;
  try{
    for(const f of t.fields){
      const v = String(draft.values[f.key]==null ? '' : draft.values[f.key]).trim();
      if(f.sensitive){
        if(v && !(draft.revealedPlain && draft.revealedPlain[f.key]===v)){ sealed[f.key] = await sealText(v); masks[f.key] = last4(v); }
        else if(existing && existing.sealed && existing.sealed[f.key]){ sealed[f.key] = existing.sealed[f.key]; masks[f.key] = existing.masks[f.key]||''; }
      } else if(v) values[f.key] = v;
    }
    const ttl = String(draft.values.title||'').trim().slice(0, TITLE_MAX);
    if(ttl) values.title = ttl;
  }catch(e){
    _saving = false; console.error(e);
    toast('Couldn’t encrypt the sensitive fields. Nothing was saved.'); return;
  }
  let newAtts = [];
  if(draft.pending && draft.pending.length){
    try{ newAtts = await storePages(draft.pending.map((p,i)=>Object.assign({}, p, { label:defaultLabel(i, p) })), t.imagesSensitive, 0); }
    catch(e){ _saving = false; console.error(e); toast('Couldn’t store the images on this phone. Nothing was saved.'); return; }
  }
  _saving = false;
  if(!draft){ deleteAttachmentFiles(newAtts); return; } // locked while encrypting
  const now = new Date().toISOString();
  const reminders = draft.reminders.map(r=>({id:r.id||uid(), amount:r.amount, unit:r.unit}));
  let d;
  const renewed = !!(existing && draft.mode==='renew');
  if(renewed){
    d = existing;
    // the current version, with its sealed values and files, becomes the newest History entry
    d.history = [{ id:'h'+uid(), replacedAt:now, typeId:d.typeId, values:d.values, sealed:d.sealed||{}, masks:d.masks||{},
      attachments:d.attachments||[], reminders:d.reminders, renewal:d.renewal||null }].concat(d.history||[]);
    Object.assign(d, { values, sealed, masks, reminders, attachments:newAtts, state:'active', renewal:null, updatedAt:now, renewedAt:now });
    delete d.archivedReason;
    delete _plain[d.id];
  } else if(existing){
    d = existing;
    Object.assign(d, { typeId:t.id, ownerId:draft.ownerId, values, sealed, masks, reminders, updatedAt:now });
    delete _plain[d.id];
  } else {
    d = { id:uid(), typeId:t.id, ownerId:draft.ownerId, values, sealed, masks, reminders, attachments:newAtts, state:'active', history:[], createdAt:now, updatedAt:now };
    state.documents.push(d);
  }
  save();
  const wasNew = !draft.id;
  discardPending(draft);
  draft = null;
  if(wasNew) replaceTop({kind:'pane', screen:'detail', id:d.id});
  else pop();
  renderNav(true);
  toast(renewed ? 'Renewed. The previous version is in History.' : wasNew ? 'Document added' : 'Changes saved');
  if(wasNew || renewed || (d.cal && calStatus(d)==='stale')) maybeOfferCalendar(d);
}

function deleteProfileFlow(pid){
  const p = profileById(pid); if(!p) return;
  const others = activeProfiles().filter(x=>x.id!==pid);
  const docs = state.documents.filter(d=>d.ownerId===pid);
  if(!others.length){ toast('You need at least one profile.'); return; }
  const finish = (msg)=>{
    p.deleted = true;
    if(ui.profile===pid) ui.profile = 'all';
    save(); pdraft = null;
    // close the sheet and the profile editor, back to the profiles list
    nav.splice(nav.length-2, 2); renderNav(true);
    toast(msg);
  };
  if(!docs.length){
    openSheet({ render:()=>`<h3>Delete ${esc(p.name)}?</h3><p class="sub">They have no documents.</p>
      <button class="opt danger" data-act="sheetChoice" data-i="0"><i class="ti ti-trash" aria-hidden="true"></i><div><div class="opt-t">Delete profile</div></div></button>
      <button class="opt" data-act="back"><i class="ti ti-x" aria-hidden="true"></i><div><div class="opt-t">Cancel</div></div></button>`,
      choices:[()=>finish('Profile deleted')] });
    return;
  }
  const choices = others.map(o=>()=>{ docs.forEach(d=>d.ownerId=o.id); finish(docs.length+' document'+(docs.length===1?'':'s')+' moved to '+o.name); });
  choices.push(()=>{ docs.forEach(d=>{ if(d.state!=='archived'){ d.state='archived'; d.archivedReason='Profile deleted'; } }); finish('Profile deleted, documents archived'); });
  openSheet({ render:()=>`<h3>Delete ${esc(p.name)}?</h3><p class="sub">${esc(p.name)} has ${docs.length} document${docs.length===1?'':'s'}. Choose what happens to them.</p>

    <button class="opt" data-act="back"><i class="ti ti-x" aria-hidden="true"></i><div><div class="opt-t">Cancel</div></div></button>`,
    choices });
}

/* ----- saving a type ----- */
function validateTypeDraft(td){
  const errors = {};
  const name = String(td.name||'').trim();
  if(!name) errors.name = 'Enter a name.';
  else if(state.types.some(t=>t.id!==td.id && t.name.trim().toLowerCase()===name.toLowerCase())) errors.name = 'There’s already a type called that.';
  if(td.reminders.some(r=>!(Number.isInteger(r.amount) && r.amount>=1 && r.amount<=600))) errors.reminders = 'Each reminder needs a whole number, 1 or more.';
  return errors;
}
// fields of the saved type, without editor bookkeeping
function cleanFields(fields){ return fields.map(f=>{ const c = Object.assign({}, f); delete c._old; return c; }); }
async function vaultPrivForChange(labels){
  if(_skPriv && anyRevealed()) return _skPriv;
  let kek = null;
  const ok = await askPassword({ title:'Confirm your password',
    message:'Needed to stop protecting '+labels.map(l=>'“'+l+'”').join(', ')+'. Its values will then show without your fingerprint or password.',
    fields:[{ label:'Password', autocomplete:'current-password' }], okLabel:'Continue',
    submit: async v=>{ kek = await checkPwd(v[0]); return kek ? null : 'Incorrect password.'; } });
  if(!ok || !kek) return null;
  return importVaultPriv(new Uint8Array(await decryptWith(kek, lockRec.skWrap)));
}
let _typeSaving = false;
async function saveTypeDraft(){
  const td = tdraft; if(!td || _typeSaving) return;
  td.name = String(td.name||'').trim();
  td.errors = validateTypeDraft(td);
  if(Object.keys(td.errors).length){ rerenderTypeEditor(); const el = $(td.errors.name?'t-name':'type-fields'); if(el && el.focus) el.focus(); return; }
  const old = td.isNew ? null : state.types.find(t=>t.id===td.id);
  const oldByKey = new Map((old ? old.fields : []).map(f=>[f.key, f]));
  const newKeys = new Set(td.fields.map(f=>f.key));
  const removed = old ? old.fields.filter(f=>!newKeys.has(f.key)).map(f=>f.key) : [];
  const toSeal = td.fields.filter(f=>f.sensitive && oldByKey.has(f.key) && !oldByKey.get(f.key).sensitive).map(f=>f.key);
  const toOpen = td.fields.filter(f=>!f.sensitive && oldByKey.has(f.key) && oldByKey.get(f.key).sensitive);
  const docs = old ? docsOfType(td.id) : [];
  const versions = d=>[d].concat(d.history||[]);
  const needsOpen = toOpen.filter(f=>docs.some(d=>versions(d).some(v=>v.sealed && v.sealed[f.key])));
  _typeSaving = true;
  try{
    let priv = null;
    if(needsOpen.length){
      priv = await vaultPrivForChange(needsOpen.map(f=>f.label));
      if(!priv){ toast('Not saved. The field is still sensitive.'); return; }
    }
    // work on copies, so a failure part-way changes nothing
    const updated = new Map();
    for(const d of docs){
      const c = clone(d); let changed = false;
      for(const v of versions(c)){
        if(!v.values) v.values = {}; if(!v.sealed) v.sealed = {}; if(!v.masks) v.masks = {};
        for(const k of removed){ if(k in v.values || k in v.sealed){ delete v.values[k]; delete v.sealed[k]; delete v.masks[k]; changed = true; } }
        for(const f of toOpen){ if(v.sealed[f.key]){ v.values[f.key] = await openSealed(priv, v.sealed[f.key]); delete v.sealed[f.key]; delete v.masks[f.key]; changed = true; } }
        for(const k of toSeal){ const val = v.values[k]; if(val!=null && val!==''){ v.sealed[k] = await sealText(String(val)); v.masks[k] = last4(val); delete v.values[k]; changed = true; } }
      }
      if(changed) updated.set(d.id, c);
    }
    if(tdraft!==td || _locked) return; // locked meanwhile
    const now = new Date().toISOString();
    const t = { id:td.id, name:td.name, icon:td.icon, imagesSensitive:!!td.imagesSensitive,
      reminders:td.reminders.map(r=>({amount:r.amount, unit:r.unit})), fields:cleanFields(td.fields), updatedAt:now };
    if(td.titleKey && td.fields.some(f=>f.key===td.titleKey)) t.titleKey = td.titleKey;
    if(td.hidden) t.hidden = true;
    if(old) state.types[state.types.indexOf(old)] = t; else state.types.push(t);
    for(const [id, c] of updated){ const d = docById(id); if(!d) continue; Object.assign(d, c, { updatedAt:now }); delete _plain[id]; }
    save();
    tdraft = null;
    pop(); renderNav(true);
    const lockedNow = await lockTypeImages().catch(()=>0);
    toast(td.isNew ? 'Type added. You can now pick it when you add a document.' : 'Type saved'+(updated.size ? ' · '+updated.size+' document'+(updated.size===1?'':'s')+' updated' : '')+(lockedNow ? ' · '+lockedNow+' image'+(lockedNow===1?'':'s')+' locked' : ''));
  }catch(e){ console.error(e); toast('Couldn’t save the type. Nothing was changed.'); }
  finally{ _typeSaving = false; }
}

    return;

  if((b==='ramount' || b==='runit') && draft){
    const r = draft.reminders[+el.dataset.idx]; if(!r) return;
    if(b==='ramount'){ const n = Number(el.value); r.amount = el.value.trim()==='' ? NaN : n; }

    tdraft.dirty = true; return;

/* =====================================================================================
   SECURITY (M2) — ported from Mandoos (GITHUB-SYNC-AND-PWA-GUIDE.md §13–14) plus a
   sensitive vault. The lock is REQUIRED in Expiry (Mandoos makes it optional).
   • Data key (DEK, AES-256-GCM) encrypts expiry_state. Stored only wrapped: under the password
     key (PBKDF2-SHA256 → 512 bits: verifier ‖ wrapping key) and under the passkey PRF secret.
   • Sensitive vault: an RSA-OAEP-2048 key pair. The public key (lock record) seals sensitive
     values whenever they're saved — no prompt needed. The private key is wrapped under the same
     two secrets and is only unwrapped by an explicit reveal, held for the reveal window, then
     dropped. So an unlocked phone still can't show a card number without a fresh fingerprint
     or password.
   ===================================================================================== */
function b64(buf){ const a = new Uint8Array(buf); let s = ''; for(let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i+0x8000)); return btoa(s); }
function unb64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
function b64url(buf){ return b64(buf).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; return unb64(s); }
async function derivePwd(pwd, saltBytes, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:saltBytes, iterations:iter }, base, 512));
  const kek = await crypto.subtle.importKey('raw', bits.slice(32), { name:'AES-GCM' }, false, ['encrypt','decrypt']);
  return { hash: b64(bits.slice(0, 32)), kek };
}
function newDataKey(){ return crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']); }
async function encryptWith(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, bytes);
  return { iv: b64(iv), ct: b64(ct) };
}
async function decryptWith(key, blob){ return crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.ct)); }
async function wrapKey(kek, dek){ return encryptWith(kek, new Uint8Array(await crypto.subtle.exportKey('raw', dek))); }
async function unwrapKey(kek, wrap){ return crypto.subtle.importKey('raw', await decryptWith(kek, wrap), { name:'AES-GCM' }, true, ['encrypt','decrypt']); }
async function newVault(){
  const kp = await crypto.subtle.generateKey({ name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256' }, true, ['encrypt','decrypt']);
  return { pub: b64(await crypto.subtle.exportKey('spki', kp.publicKey)), priv: new Uint8Array(await crypto.subtle.exportKey('pkcs8', kp.privateKey)) };
}
function importVaultPriv(bytes){ return crypto.subtle.importKey('pkcs8', bytes, { name:'RSA-OAEP', hash:'SHA-256' }, false, ['decrypt']); }
let _skPubKey = null;
async function sealText(text){
  if(!lockRec) throw new Error('no vault');
  if(!_skPubKey) _skPubKey = await crypto.subtle.importKey('spki', unb64(lockRec.skPub), { name:'RSA-OAEP', hash:'SHA-256' }, false, ['encrypt']);
  const k = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt']);
  const ek = await crypto.subtle.encrypt({ name:'RSA-OAEP' }, _skPubKey, await crypto.subtle.exportKey('raw', k));
  const blob = await encryptWith(k, new TextEncoder().encode(text));
  return { ek: b64(ek), iv: blob.iv, ct: blob.ct };
}
async function openSealed(priv, sealed){
  const raw = await crypto.subtle.decrypt({ name:'RSA-OAEP' }, priv, unb64(sealed.ek));
  const k = await crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['decrypt']);
  return new TextDecoder().decode(await decryptWith(k, sealed));
}
// Moves any plaintext sensitive value (M1 data) into the vault. Returns how many were sealed.
async function sealPlainSensitive(){
  let n = 0;
  for(const d of state.documents){
    for(const ver of [d].concat(d.history||[])){
      const t = typeById(ver.typeId || d.typeId);
      if(!ver.values) ver.values = {}; if(!ver.sealed) ver.sealed = {}; if(!ver.masks) ver.masks = {};
      for(const f of t.fields){
        if(!f.sensitive) continue;
        const v = ver.values[f.key];
        if(v==null || v==='') continue;
        ver.sealed[f.key] = await sealText(String(v)); ver.masks[f.key] = last4(v);
        delete ver.values[f.key]; n++;
      }
    }
  }
  return n;
}
// Locks (vault-seals) any saved image whose document type is Locked, in current and History versions.
// Each gets a new file id, so sync uploads the locked copy and deletes the old Gist. Returns how many.
let _imgLockP = null;
function lockTypeImages(){
  if(!_imgLockP) _imgLockP = (async()=>{
    let n = 0; const touched = new Set();
    try{
      for(const d of state.documents.slice()){
        for(const ver of [d].concat(d.history||[])){
          if(!typeById(ver.typeId || d.typeId).imagesSensitive) continue;
          for(const a of (ver.attachments||[]).slice()){
            if(a.sensitive || a.userUnlocked) continue; // userUnlocked: “Stop treating as sensitive” on this image
            if(_locked || !_sessionKey) return n;
            let bytes; try{ bytes = await readFile(a.id); }catch(e){ continue; } // not on this phone yet
            const id = 'f'+uid();

async function makeLockRecord(pwd, dek, skPub, skBytes){

}
async function checkPwd(pwd){
  if(!HAS_SUBTLE || !lockRec || !pwd) return null;
  const d = await derivePwd(pwd, unb64(lockRec.salt), lockRec.iter || PBKDF2_ITER);
  return d.hash === lockRec.hash ? d.kek : null;
}

/* ----- creating the lock (setup) ----- */
async function createLock(pwd){
  const dek = await newDataKey();
  const vault = await newVault();
  const rec = await makeLockRecord(pwd, dek, vault.pub, vault.priv);
  // Record first, then data: if interrupted, unlock accepts plaintext under a record and encrypts it.
  localStorage.setItem(LOCK_REC_KEY, JSON.stringify(rec));
  lockRec = rec; _skPubKey = null; _sessionKey = dek; _locked = false;
  normalizeLoadedState();
  await sealPlainSensitive();
  secureWrite(STATE_KEY, JSON.stringify(state));
  await flushSecureWrites();
  let ok = false;
  try{ ok = isEncBlob(JSON.parse(localStorage.getItem(STATE_KEY))); }catch(e){}
  if(!ok){
    lockRec = null; _sessionKey = null;
    try{ localStorage.removeItem(LOCK_REC_KEY); }catch(e){}
    throw new Error('encrypted copy could not be stored');
  }
  markActive();
  return { dek, skBytes: vault.priv };
}

/* ----- fingerprint (WebAuthn passkey + PRF) -----
   Only offered where the authenticator supports PRF: the PRF secret is what decrypts. There's no
   server, so the assertion is verified on the device (challenge, origin, user-verified flag,
   signature against the stored public key). */
let _bioPlatform = null, _bioInFlight = false;

async function checkBioPlatform(){
  try{ _bioPlatform = bioApiPresent() && !!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch(e){ _bioPlatform = false; }

async function prfToKey(out){ return crypto.subtle.importKey('raw', new Uint8Array(out).slice(0, 32), { name:'AES-GCM' }, false, ['encrypt','decrypt']); }
function derToRawSig(der){
  let p = 2; if(der[1] & 0x80) p += der[1] & 0x7f;
  const read = ()=>{ p++; const len = der[p++]; let v = der.slice(p, p+len); p += len;
    while(v.length > 32 && v[0] === 0) v = v.slice(1);
    const out = new Uint8Array(32); out.set(v, 32 - v.length); return out; };
  const r = read(), s = read(), raw = new Uint8Array(64); raw.set(r, 0); raw.set(s, 32); return raw;
}
async function verifyAssertionSig(rec, resp){
  if(!rec.pubKey || (rec.alg !== -7 && rec.alg !== -257)) return true; // no key recorded: rely on the UV flag
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', resp.clientDataJSON));
  const ad = new Uint8Array(resp.authenticatorData), data = new Uint8Array(ad.length + hash.length);
  data.set(ad, 0); data.set(hash, ad.length);
  const sig = new Uint8Array(resp.signature);
  if(rec.alg === -7){
    const k = await crypto.subtle.importKey('spki', unb64(rec.pubKey), { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
    return crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, k, derToRawSig(sig), data);
  }
  const k = await crypto.subtle.importKey('spki', unb64(rec.pubKey), { name:'RSASSA-PKCS1-v1_5', hash:'SHA-256' }, false, ['verify']);
  return crypto.subtle.verify('RSASSA-PKCS1-v1_5', k, sig, data);
}
async function bioAssert(rec){
  expectExternalUi();
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const opts = { challenge, allowCredentials:[{ type:'public-key', id: unb64url(rec.credId) }], userVerification:'required', timeout:60000,
    extensions:{ prf:{ eval:{ first: unb64(rec.prfSalt) } } } };
  const a = await navigator.credentials.get({ publicKey: opts });
  const cd = JSON.parse(new TextDecoder().decode(a.response.clientDataJSON));
  if(cd.type !== 'webauthn.get' || cd.challenge !== b64url(challenge) || cd.origin !== location.origin) throw new Error('The fingerprint response didn’t match this request.');
  if(!(new Uint8Array(a.response.authenticatorData)[32] & 0x04)) throw new Error('Your phone didn’t confirm your fingerprint.');
  if(!(await verifyAssertionSig(rec, a.response))) throw new Error('The fingerprint signature check failed.');
  const ext = a.getClientExtensionResults ? a.getClientExtensionResults() : {};
  const out = ext.prf && ext.prf.results ? ext.prf.results.first : null;
  if(!out) throw new Error('Your phone didn’t return the unlock secret. Use your password.');
  return out;
}
function bioErrorText(e, fallback){ return e && e.name==='NotAllowedError' ? 'Fingerprint cancelled. Try again or use your password.' : (e && e.message) || fallback; }
// Creates the passkey and wraps both keys under its PRF secret. Returns {ok, message}.
async function createPasskey(dek, skBytes){
  if(!bioApiPresent() || !_bioPlatform) return { ok:false, message:'Fingerprint unlock isn’t available on this device.' };
  _bioInFlight = true; expectExternalUi();
  try{
    const prfSalt = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({ publicKey:{
      rp:{ name:'Expiry' },
      user:{ id: crypto.getRandomValues(new Uint8Array(16)), name:'expiry', displayName:'Expiry' },
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams:[{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout:60000, attestation:'none',
      extensions:{ prf:{ eval:{ first: prfSalt } } }
    }});
    const r = cred.response;
    const pub = r.getPublicKey ? r.getPublicKey() : null;
    const rec = { credId:b64url(cred.rawId), prf:true, prfSalt:b64(prfSalt), pubKey: pub ? b64(pub) : null, alg: r.getPublicKeyAlgorithm ? r.getPublicKeyAlgorithm() : null, createdAt:new Date().toISOString(), dekWrap:null, skWrap:null };
    const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    if(!(ext.prf && ext.prf.enabled)) return { ok:false, message:'This phone’s fingerprint can’t unlock encrypted data. Keep using your password.' };
    // some authenticators return the PRF secret at creation; otherwise one more prompt fetches it
    let out = ext.prf.results && ext.prf.results.first;
    if(!out){ try{ out = await bioAssert(rec); }catch(e){ out = null; } }
    if(!out) return { ok:false, message:'This phone’s fingerprint can’t unlock encrypted data. Keep using your password.' };
    const pk = await prfToKey(out);
    rec.dekWrap = await wrapKey(pk, dek);
    rec.skWrap = await encryptWith(pk, skBytes);
    localStorage.setItem(BIO_KEY, JSON.stringify(rec));
    return { ok:true };
  }catch(e){
    console.warn('Passkey creation failed:', e);
    return { ok:false, message: e && e.name==='NotAllowedError' ? 'Cancelled. Fingerprint unlock wasn’t turned on.' : 'Couldn’t set up fingerprint unlock.' };
  }finally{ _bioInFlight = false; markActive(); }
}

function openRevealPrompt(docId){
  const d = docById(docId); if(!d) return;
  if(isRevealedFor(docId)) return;
  const bioOn = !!loadBio() && bioApiPresent();
  const t = typeById(d.typeId);

let _revealBusy = false;
async function revealWithPassword(docId){
  if(_revealBusy) return;
  const inp = $('reveal-pw'), err = $('reveal-err'); if(!inp) return;
  if(!inp.value){ err.textContent = 'Enter your password.'; inp.focus(); return; }
  _revealBusy = true; err.textContent = 'Checking…';
  try{
    const kek = await checkPwd(inp.value);
    if(!kek){ err.textContent = 'Incorrect password. Try again.'; inp.value = ''; inp.focus(); return; }
    const priv = await importVaultPriv(new Uint8Array(await decryptWith(kek, lockRec.skWrap)));
    if(topEntry() && topEntry().reveal) pop();

  }catch(e){ console.error(e); err.textContent = 'Couldn’t unlock sensitive info.'; }

}
async function revealWithBio(docId){
  const rec = loadBio(); if(!rec || _bioInFlight || _revealBusy) return;
  const err = $('reveal-err');
  _bioInFlight = true; if(err) err.textContent = '';
  try{
    const out = await bioAssert(rec);
    const priv = await importVaultPriv(new Uint8Array(await decryptWith(await prfToKey(out), rec.skWrap)));
    if(topEntry() && topEntry().reveal) pop();

  }catch(e){

}

/* ----- auto-lock (as Mandoos): idle minutes, or at once on leaving. Per device. Default 5. ----- */
const AUTOLOCK_OPTIONS = [['0','Never'],['leave','When I leave the app'],['1','After 1 minute'],['5','After 5 minutes'],['15','After 15 minutes'],['30','After 30 minutes']];
let _lastActive = Date.now();
let _externalUiUntil = 0; // fingerprint prompts and file pickers must not trigger "lock when I leave"
function expectExternalUi(){ _externalUiUntil = Date.now() + 120000; }
function autoLockSetting(){ let v = null; try{ v = localStorage.getItem(AUTOLOCK_KEY); }catch(e){} return AUTOLOCK_OPTIONS.some(o=>o[0]===v) ? v : '5'; }
function setAutoLock(v){

function markActive(){ _lastActive = Date.now(); }
